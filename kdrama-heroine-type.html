<script>
var POS = ["순정형", "능력형", "엉뚱형", "도도형", "힐러형"];
var QUESTIONS = [{"q": "짝사랑하는 사람이 생기면 나는?", "options": ["고민 끝에 결국 마음을 고백해버려", "마음은 접어두고 일단 내 할 일에 집중해", "실수로 티가 나서 주변에 다 들켜버려", "티 안 내고 무심한 척 계속 지켜봐", "표현은 안 해도 은근히 잘 챙겨주게 돼"]}, {"q": "친구가 힘들어할 때 나는?", "options": ["같이 울어주면서 마음을 다 쏟아", "해결책부터 같이 찾아줘", "웃긴 얘기로 분위기부터 풀어줘", "말은 안 해도 묵묵히 곁에 있어줘", "따뜻한 밥 한 끼부터 챙겨줘"]}, {"q": "억울한 일을 당하면 나는?", "options": ["감정이 앞서서 눈물부터 나", "차분히 근거를 정리해서 반박해", "일단 당황해서 허둥지둥해", "겉으론 태연한 척, 속은 부글부글", "내 억울함보다 상대 마음부터 헤아려"]}, {"q": "소개팅에 나가면 나는?", "options": ["마음에 들면 적극적으로 티를 내", "조건이나 대화 수준을 냉정하게 판단해", "긴장해서 이상한 소리를 하고 와", "무표정으로 일관하다 나중에 후회해", "상대가 편하게 느끼도록 배려부터 해"]}, {"q": "갑자기 위기 상황이 닥치면 나는?", "options": ["일단 몸이 먼저 움직여", "침착하게 상황을 분석하고 판단해", "당황해서 우왕좌왕하다 의외의 활약을 해", "겉으론 냉정하게, 계산적으로 대처해", "내 걱정보다 주변 사람부터 챙겨"]}, {"q": "우연히 첫사랑을 다시 만나면 나는?", "options": ["심장이 쿵 하고 옛 감정이 확 밀려와", "동요 없이 쿨하게 안부만 묻고 지나가", "너무 놀라서 이상한 행동을 하고 도망쳐", "무심한 척하지만 뒤돌아서 마음이 복잡해져", "반가운 마음에 먼저 안부를 물어봐"]}, {"q": "주변 사람이 나를 오해하면 나는?", "options": ["속상해서 눈물부터 핑 돌아", "논리적으로 조목조목 해명해", "억울해서 횡설수설 변명하게 돼", "구차하게 해명 안 하고 그냥 넘어가", "오해한 사람 마음도 이해하려고 노력해"]}, {"q": "좋아하는 사람 앞에서 나는?", "options": ["감정이 얼굴에 다 드러나", "평소와 다름없이 프로페셔널하게 대해", "괜히 오두방정 떨다가 실수를 연발해", "오히려 더 무뚝뚝하고 퉁명스러워져", "평소보다 더 다정하게 챙겨주게 돼"]}, {"q": "인생의 큰 결정을 내릴 때 나는?", "options": ["마음이 이끄는 대로 결정해", "장단점을 꼼꼼히 따져서 결정해", "즉흥적으로 끌리는 대로 결정해", "혼자 조용히 고민해서 결정해", "주변 사람들 의견도 참고해서 결정해"]}, {"q": "위로가 필요한 날, 힘이 되는 건?", "options": ["누군가 내 마음을 진심으로 알아줄 때", "스스로 문제를 해결하고 나서의 성취감", "그냥 신나게 웃고 떠드는 시간", "혼자 조용히 정리하는 시간", "누군가를 챙기고 나서 오는 뿌듯함"]}, {"q": "드라마 주인공이 된다면 원하는 전개는?", "options": ["우여곡절 끝에 이루어지는 절절한 로맨스", "일에서 인정받고 성장하는 서사", "예측불가 사건사고가 가득한 코믹 전개", "츤데레 매력을 뽐내는 밀당 로맨스", "주변 사람들과 함께 성장하는 힐링 스토리"]}, {"q": "친구들 사이에서 나의 포지션은?", "options": ["감정에 제일 솔직하고 리액션 큰 친구", "믿고 의지하는 든든한 조언자", "분위기 메이커, 사고뭉치 귀요미", "쿨해 보이지만 은근 다정한 츤데레", "다들 힘들 때 제일 먼저 찾는 든든한 존재"]}];
var RESULTS = [{"name": "순정 직진형", "emoji": "💌", "tagline": "사랑 앞에서는 계산이 없는 솔직함", "color": "#D65A7A", "desc": "감정에 솔직하고 마음이 가는 대로 행동하는 타입이에요. 좋아하는 마음이 생기면 숨기기보다 직진하는 편이라, 주변에서도 이 사람의 감정을 쉽게 알아차려요. 상처받을 걸 알면서도 진심을 다하는 모습이 매력적이지만, 가끔은 감정에 휩쓸려 성급한 결정을 내릴 때도 있어요.", "traits": ["감정에 솔직함", "직진 스타일", "눈물 많음", "진심파"]}, {"name": "커리어 능력형", "emoji": "💼", "tagline": "일도 사랑도 완벽하게 해내고 싶은 타입", "color": "#2E5C8A", "desc": "침착하고 이성적인 판단력이 강점인 타입이에요. 감정보다 상황을 냉정하게 분석하는 걸 우선하고, 어떤 자리에서도 흔들림 없는 모습을 보여줘요. 프로페셔널한 매력이 넘치지만, 가끔은 감정을 너무 억누르다 보니 힘든 마음을 혼자 삭이는 경우도 있어요.", "traits": ["침착함", "냉철한 판단", "프로페셔널", "숨은 다정함"]}, {"name": "발랄 엉뚱형", "emoji": "🎈", "tagline": "예측불가 매력으로 분위기를 살리는 타입", "color": "#E8A33D", "desc": "감정 표현이 솔직하고 리액션이 커서 어디서든 분위기를 살리는 타입이에요. 실수도 잦고 허둥대는 순간도 많지만, 그게 오히려 매력 포인트가 되는 편이에요. 눈치 보지 않고 자기 감정에 충실한 모습이 사랑스럽지만, 신중함이 조금 아쉬울 때도 있어요.", "traits": ["엉뚱발랄", "리액션 부자", "사고뭉치", "사랑스러움"]}, {"name": "시크 도도형", "emoji": "❄️", "tagline": "겉은 차갑지만 속은 누구보다 다정한 츤데레", "color": "#6B5B95", "desc": "겉으로는 무심하고 쿨해 보이지만, 속으로는 세심하게 상대를 챙기는 타입이에요. 감정을 잘 드러내지 않아서 오해를 사기도 하지만, 알고 보면 누구보다 진심인 츤데레 매력이 있어요. 마음을 여는 데 시간이 걸리는 만큼, 한번 곁을 내주면 오래도록 진심을 다해요.", "traits": ["시크한 매력", "츤데레", "속정 깊음", "느린 표현"]}, {"name": "다정 힐러형", "emoji": "🌷", "tagline": "곁에 있는 사람을 먼저 챙기는 다정한 존재", "color": "#5B9279", "desc": "주변 사람들의 마음을 잘 헤아리고, 힘든 순간마다 먼저 손을 내미는 타입이에요. 내 감정보다 상대의 마음을 먼저 살피는 다정함이 있어서, 주변 사람들이 가장 편하게 기대는 존재가 돼요. 다만 남을 챙기느라 정작 자신의 마음은 뒤로 미루는 경우가 많아요.", "traits": ["다정함", "배려심", "든든한 존재", "자기 돌봄 필요"]}];

var qi=0, counts=[0,0,0,0,0];
function show(id){ ['s1','s2','s3'].forEach(function(s){ document.getElementById(s).className=s===id?'':'hidden'; }); }
function startQuiz(){ qi=0; counts=[0,0,0,0,0]; show('s2'); renderQ(); }
function renderQ(){
  var q=QUESTIONS[qi], total=QUESTIONS.length;
  document.getElementById('progLabel').textContent=(qi+1)+' / '+total;
  document.getElementById('progFill').style.width=Math.round((qi)/total*100)+'%';
  document.getElementById('qNum').textContent='Q'+(qi+1);
  document.getElementById('qText').textContent=q.q;
  var opts=document.getElementById('opts');
  opts.innerHTML='';
  q.options.forEach(function(opt,i){
    var b=document.createElement('button');
    b.className='opt'; b.textContent=opt;
    b.onclick=function(){ pick(i); };
    opts.appendChild(b);
  });
}
function pick(i){
  var btns=document.querySelectorAll('.opt');
  btns.forEach(function(b){ b.disabled=true; });
  btns[i].className='opt pk';
  counts[i]++;
  setTimeout(function(){ qi++; if(qi<QUESTIONS.length){ renderQ(); } else { showResult(); } }, 260);
}
function showResult(){
  show('s3');
  var best=0;
  for(var i=1;i<counts.length;i++){ if(counts[i]>counts[best]) best=i; }
  var r=RESULTS[best];
  document.getElementById('resEm').textContent=r.emoji;
  document.getElementById('resBadge').textContent=POS[best]+' 유형';
  document.getElementById('resBadge').style.background=r.color;
  document.getElementById('resTitle').textContent=r.name;
  document.getElementById('resTag').textContent=r.tagline;
  document.getElementById('resTag').style.color=r.color;
  document.getElementById('resDesc').textContent=r.desc;
  document.getElementById('resTraits').innerHTML=r.traits.map(function(t){return '<span class="trait">#'+t+'</span>';}).join('');
  var total=QUESTIONS.length;
  var distHtml='';
  POS.forEach(function(p,i){
    var pct=Math.round(counts[i]/total*100);
    distHtml+='<div class="dist-row'+(i===best?' me':'')+'"><div class="lab">'+p+'</div>'+
      '<div class="track"><div class="fill" style="width:'+pct+'%"></div></div>'+
      '<div class="num">'+counts[i]+'</div></div>';
  });
  document.getElementById('distBox').innerHTML=distHtml;
}
async function saveImg(){
  document.getElementById('mo').classList.add('on');
  document.getElementById('mw').innerHTML='이미지를 만들고 있어요...';
  try{
    if(document.fonts) await document.fonts.ready;
    var cv=await html2canvas(document.getElementById('cap'),{backgroundColor:'#FFFFFF',scale:2});
    var img=new Image(); img.src=cv.toDataURL('image/png');
    document.getElementById('mw').innerHTML='';
    document.getElementById('mw').appendChild(img);
    var p=document.createElement('p'); p.style.cssText='font-size:12px;color:#888;margin-top:8px;';
    p.textContent='이미지를 길게 눌러서 저장해주세요.';
    document.getElementById('mw').appendChild(p);
  }catch(e){ document.getElementById('mw').textContent='이미지 생성에 실패했어요.'; }
}
