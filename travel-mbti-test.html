<style>
:root{--bg:#F4F2ED;--paper:#FDFCF8;--ink:#1C1C1C;--sub:#6B6B6B;--line:#B0A898;--acc:#8E6FB0;--soft:rgba(142,111,176,0.12);--deep:rgba(142,111,176,0.24);--accFg:#fff;--softFg:#1C1C1C;--deepFg:#1C1C1C;--chip:rgba(28,28,28,0.07);--chips:rgba(28,28,28,0.1);--r:2px;--bw:2px;--shadow:none;--fh:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;--fb:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
*{box-sizing:border-box;}
html{background:#F4F2ED;}
body{margin:0;min-height:100vh;color:var(--ink);background-color:var(--bg);background-image:none;background-size:auto;font-family:var(--fb);word-break:keep-all;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;line-height:1.6;}
h1,h2,h3,.qx,.rn h3,.sheeth h2,.reveal .code,.dsh,.blt,.cmph,.maph,.sheetsec{font-family:var(--fh);}
button,input{font:inherit;-webkit-tap-highlight-color:transparent;}
.app{width:100%;max-width:560px;margin:0 auto;padding:26px 14px 46px;}
.sc{display:none;} .sc.on{display:block;animation:in .18s ease;}
@keyframes in{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.pa{background:var(--paper);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);}
.btn{width:100%;min-height:54px;padding:12px;cursor:pointer;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--paper);color:var(--ink);font-size:16px;font-weight:800;}
.btn:active{transform:scale(.99);}
.btn.fill{background:var(--acc);border-color:var(--acc);color:var(--accFg);}
.stk{display:grid;gap:10px;margin-top:14px;}
.intro{padding:0 0 24px;text-align:center;overflow:hidden;}
.hero{margin:0 0 20px;line-height:0;}
.hero svg{display:block;width:100%;height:auto;}
.intro>h1,.intro>p,.intro>.castt,.intro>.cast,.intro>.mt,.intro>.em{margin-left:18px;margin-right:18px;}
.intro>.em{padding-top:34px;}
.intro .em{font-size:54px;line-height:1;margin-bottom:12px;}
.intro h1{font-size:25px;line-height:1.45;margin:0 0 10px;font-weight:700;letter-spacing:-.2px;text-wrap:balance;}
.intro p{font-size:14.5px;color:var(--sub);line-height:1.8;margin:0;font-weight:400;text-wrap:pretty;}
.castt{margin:20px 0 10px;font-size:12.5px;font-weight:800;color:var(--acc);}
.mt{margin-top:16px;font-size:12.5px;font-weight:700;color:var(--sub);}
.langhint{margin-top:8px;font-size:11px;font-weight:500;color:var(--sub);opacity:.75;line-height:1.6;}
.cast{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;}
.ci{min-width:0;padding:9px 3px 8px;background:var(--chip);border:var(--bw) solid var(--line);border-radius:var(--r);text-align:center;}
.ci .e{font-size:22px;line-height:1;display:block;margin-bottom:4px;}
.ci .n{font-size:11px;font-weight:600;line-height:1.4;word-break:keep-all;text-wrap:balance;}
.ci .t{font-size:8.5px;color:var(--sub);opacity:.8;font-weight:700;margin-top:2px;display:block;}
.intro .mt{font-size:12px;color:var(--sub);opacity:.75;margin-top:16px;font-weight:700;}
.nb{padding:40px 24px;text-align:center;}
.nb h2{font-size:22px;margin:0 0 22px;font-weight:800;line-height:1.4;text-wrap:balance;}
.nb input{width:100%;max-width:340px;height:54px;padding:0 14px;text-align:center;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--chip);color:var(--ink);font-size:19px;font-weight:800;outline:none;}
.nb input:focus{border-color:var(--acc);}
.gd{max-width:400px;margin:24px auto 0;padding:14px 16px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--chip);font-size:13.5px;line-height:1.8;font-weight:600;text-align:left;color:var(--sub);text-wrap:pretty;}
.qw{padding:24px 20px 28px;}
.qt{padding-bottom:14px;border-bottom:var(--bw) solid var(--line);}
.qi{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px;font-size:12px;font-weight:800;}
.qi .sec{color:var(--acc);}
.trk{width:100%;height:14px;padding:2px;background:var(--chip);border:var(--bw) solid var(--line);border-radius:var(--r);}
.fil{width:0;height:100%;background:var(--acc);border-radius:var(--r);transition:width .2s ease;}
.pdots{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;}
.pdot{height:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--chip);opacity:.35;}
.pdot.dn{opacity:1;background:var(--acc);}
.pdot.now{opacity:1;background:var(--acc);animation:blink .7s infinite alternate;}
@keyframes blink{from{opacity:.4;}to{opacity:1;}}
.psq{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;}
.psq i{display:block;aspect-ratio:1/1;min-height:12px;border:1px solid var(--line);border-radius:2px;background:var(--chip);}
.psq i.dn{background:var(--acc);}
.qn{margin-top:22px;color:var(--acc);font-size:13px;font-weight:900;}
.qx{min-height:76px;margin:14px 0 20px;text-align:center;font-size:21px;line-height:1.6;letter-spacing:-.2px;font-weight:700;display:flex;align-items:center;justify-content:center;text-wrap:balance;}
.ops{display:grid;gap:11px;}
.op{position:relative;width:100%;min-height:70px;padding:15px 16px 15px 52px;cursor:pointer;text-align:left;color:var(--ink);background:var(--chip);border:var(--bw) solid var(--line);border-radius:var(--r);font-size:15.5px;line-height:1.6;font-weight:500;text-wrap:pretty;}
.op::before{content:attr(data-n);position:absolute;left:14px;top:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:var(--bw) solid var(--line);border-radius:var(--r);transform:translateY(-50%);font-size:13px;font-weight:900;background:var(--paper);}
.op.pk{background:var(--soft);border-color:var(--acc);color:var(--softFg);}
.op.pk::before{color:var(--ink);}
.op:disabled{cursor:default;}
.qnote{margin:20px 0 0;color:var(--sub);text-align:center;font-size:12px;font-weight:700;}
.qback{display:block;margin:14px auto 0;padding:8px 4px;background:none;border:0;color:var(--sub);font-family:var(--fb);font-size:12.5px;font-weight:700;cursor:pointer;text-align:center;}
.lw{min-height:420px;padding:40px 22px;display:flex;align-items:center;justify-content:center;text-align:center;}
.lw h2{margin:0 0 10px;font-size:24px;font-weight:800;line-height:1.4;text-wrap:balance;}
.lw p{margin:0;color:var(--sub);font-size:14px;}
.dts{display:flex;justify-content:center;gap:9px;margin:28px 0 24px;}
.dts span{width:12px;height:12px;background:var(--acc);border:var(--bw) solid var(--line);border-radius:var(--r);animation:bump 1.1s ease-in-out infinite;}
.dts span:nth-child(2){animation-delay:.15s;} .dts span:nth-child(3){animation-delay:.3s;}
@keyframes bump{0%,100%{transform:translateY(0);opacity:.4;}50%{transform:translateY(-7px);opacity:1;}}
.lbar{width:100%;height:14px;background:var(--chip);border:var(--bw) solid var(--line);border-radius:var(--r);overflow:hidden;}
.lbar span{display:block;width:32%;height:100%;background:var(--acc);animation:sld 1.05s ease-in-out infinite;}
@keyframes sld{from{transform:translateX(-110%);}to{transform:translateX(340%);}}
.cap{overflow:hidden;max-width:100%;background:var(--paper);border:var(--bw) solid var(--line);border-radius:var(--r);}
.rh{padding:13px 18px;background:var(--acc);border-bottom:var(--bw) solid var(--line);text-align:center;}
.rh h2{margin:0;color:var(--accFg);font-size:15.5px;font-weight:700;line-height:1.45;letter-spacing:-.1px;text-wrap:balance;}
.rb{padding:14px;}
.rn{padding:24px 16px 20px;text-align:center;background:var(--soft);border:var(--bw) solid var(--line);border-radius:var(--r);}
.rn .em{font-size:64px;line-height:1;}
.rn h3{margin:10px 0 6px;font-size:29px;font-weight:700;line-height:1.3;letter-spacing:-.3px;color:var(--acc);text-wrap:balance;}
.rn .tg2{font-size:14.5px;font-weight:600;color:var(--ink);opacity:.85;}
.rn .cd{display:inline-block;margin-top:12px;padding:4px 12px;background:var(--acc);color:var(--accFg);border-radius:999px;font-size:11px;font-weight:800;letter-spacing:1.2px;}
.rs{margin-top:12px;padding:15px 16px;background:var(--chip);border:var(--bw) solid var(--line);border-radius:var(--r);font-size:15px;line-height:1.8;font-weight:400;text-wrap:pretty;}
.blk{margin-top:14px;}
.blt{margin:0;padding:9px 12px;background:var(--deep);color:var(--deepFg);border:var(--bw) solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0;font-size:13px;font-weight:900;text-align:center;text-wrap:balance;}
.qb{padding:18px 16px;text-align:center;background:var(--soft);color:var(--softFg);border:var(--bw) solid var(--line);border-radius:0 0 var(--r) var(--r);font-size:17px;font-weight:600;line-height:1.65;text-wrap:balance;}
.qbb{position:relative;margin:6px 16px 24px;padding:18px 16px;background:var(--soft);color:var(--softFg);border:var(--bw) solid var(--line);border-radius:var(--r);font-size:16px;font-weight:600;line-height:1.65;text-align:center;text-wrap:balance;}
.qbb::before{content:"";position:absolute;left:32px;bottom:-11px;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:13px solid var(--line);}
.qbb::after{content:"";position:absolute;left:34.5px;bottom:-6.5px;width:0;height:0;border-left:8.5px solid transparent;border-right:8.5px solid transparent;border-top:10px solid var(--soft);}
.trs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:var(--bw) solid var(--line);border-left:var(--bw) solid var(--line);}
.tc{min-height:82px;padding:9px 6px;display:flex;align-items:center;justify-content:center;background:var(--chip);color:var(--ink);border-right:var(--bw) solid var(--line);border-bottom:var(--bw) solid var(--line);text-align:center;font-size:13px;line-height:1.55;font-weight:500;word-break:keep-all;text-wrap:balance;}
.tc:nth-child(even){background:var(--soft);color:var(--softFg);}
.trss{display:flex;flex-wrap:wrap;gap:10px 8px;padding:16px 14px;background:var(--chip);border-top:var(--bw) solid var(--line);}
.tst{padding:8px 13px;background:var(--paper);border:var(--bw) solid var(--line);border-radius:999px;font-size:12.5px;font-weight:700;box-shadow:2px 2px 0 var(--line);word-break:keep-all;text-wrap:balance;color:var(--ink);}
.tst:nth-child(3n+1){transform:rotate(-2.5deg);}
.tst:nth-child(3n+2){transform:rotate(1.5deg);}
.tst:nth-child(3n){transform:rotate(-0.5deg);}
.tst:nth-child(even){background:var(--soft);color:var(--softFg);}
.duo{display:grid;gap:10px;}
.dsec{border:var(--bw) solid var(--line);border-radius:var(--r);overflow:hidden;}
.dsh{padding:9px;text-align:center;font-size:14px;font-weight:900;color:var(--deepFg);border-bottom:var(--bw) solid var(--line);}
.dsec.g .dsh{background:var(--acc);color:var(--accFg);}
.dsec.b .dsh{background:var(--deep);}
.dls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px 10px;padding:12px 11px;background:var(--chip);}
.dit span{text-wrap:pretty;}
.dit{display:flex;align-items:flex-start;min-width:0;font-size:13px;line-height:1.55;font-weight:500;word-break:keep-all;}
.dit b{width:7px;height:7px;margin:5px 6px 0 0;flex:0 0 auto;background:var(--acc);border-radius:1px;}
.dit.chk b{width:17px;height:17px;margin:1px 8px 0 0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;background:var(--acc);color:var(--accFg);}
.dsec.b .dit.chk b{background:var(--sub);color:var(--paper);}
.sts{padding:14px 12px;background:var(--chip);border:var(--bw) solid var(--line);border-radius:0 0 var(--r) var(--r);}
.srow{display:grid;grid-template-columns:76px 1fr 42px;align-items:center;gap:9px;}
.srow+.srow{margin-top:11px;}
.slab{font-size:12.5px;font-weight:900;}
.sqs{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;}
.sq{aspect-ratio:1/1;min-height:11px;border-radius:2px;background:var(--chips);box-shadow:inset 0 0 0 1px rgba(176,168,152,0.35);}
.sq.f{background:var(--acc);}
.spc{text-align:right;font-size:12.5px;font-weight:900;}
.stsr{padding:16px 12px;background:var(--chip);border:var(--bw) solid var(--line);border-radius:0 0 var(--r) var(--r);display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:14px 8px;}
.rgauge{display:flex;flex-direction:column;align-items:center;gap:6px;}
.rgauge svg{width:64px;height:64px;overflow:visible;}
.rgauge .rtrack{fill:none;stroke:var(--chips);stroke-width:6;}
.rgauge .rfill{fill:none;stroke:var(--acc);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s ease;}
.rgauge .rlab{font-size:11px;font-weight:800;color:var(--sub);text-align:center;line-height:1.35;}
.cds{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;}
.cd2{padding:12px 11px;background:var(--chip);border:var(--bw) solid var(--line);border-radius:var(--r);}
.cd2 b{display:inline-block;margin-bottom:7px;padding:3px 9px;background:var(--acc);color:var(--accFg);border-radius:999px;font-size:10.5px;font-weight:800;}
.cd2 p{margin:0;font-size:13.5px;line-height:1.65;font-weight:500;text-wrap:pretty;}
.cdt{background:var(--paper);border:var(--bw) solid var(--line);border-radius:0 0 var(--r) var(--r);padding:2px 16px;}
.cdti{padding:12px 0;border-bottom:var(--bw) dashed var(--line);}
.cdti:last-child{border-bottom:0;}
.cdti b{display:block;font-size:11px;font-weight:900;color:var(--acc);margin-bottom:3px;letter-spacing:.2px;}
.cdti span{display:block;font-size:13.5px;font-weight:600;line-height:1.55;text-wrap:pretty;}
.map{margin-top:14px;border:var(--bw) solid var(--line);border-radius:var(--r);overflow:hidden;}
.maph{padding:9px 12px;background:var(--deep);color:var(--deepFg);border-bottom:var(--bw) solid var(--line);font-size:13px;font-weight:900;text-align:center;}
.mapg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--chip);}
.mapc{position:relative;min-width:0;padding:9px 3px 8px;text-align:center;border-right:1px solid rgba(176,168,152,0.18);border-bottom:1px solid rgba(176,168,152,0.18);}
.mapc:nth-child(4n){border-right:0;}
.mapc:nth-last-child(-n+4){border-bottom:0;}
.mapc .e{display:block;font-size:20px;line-height:1;}
.mapc .n{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-top:4px;font-size:9px;font-weight:600;line-height:1.35;overflow:hidden;word-break:keep-all;text-wrap:balance;padding:0 2px;min-height:24px;}
.mapc .p{display:block;margin-top:2px;font-size:9.5px;font-weight:900;opacity:.75;}
.mapc.me{outline:var(--bw) solid var(--acc);outline-offset:-2px;}
.mapc .badge{display:inline-block;margin-top:2px;padding:1px 7px;border-radius:999px;background:var(--acc);color:var(--accFg);font-size:9px;font-weight:800;}
.mapf{display:flex;align-items:center;gap:7px;padding:9px 12px;background:var(--chip);border-top:var(--bw) solid var(--line);font-size:9.5px;font-weight:800;color:var(--sub);}
.mapbar{flex:1;height:7px;border-radius:999px;}
.cmp{margin-top:14px;border:var(--bw) solid var(--line);border-radius:var(--r);overflow:hidden;}
.cmph{padding:9px 12px;background:var(--deep);color:var(--deepFg);border-bottom:var(--bw) solid var(--line);font-size:13px;font-weight:900;text-align:center;}
.cmpg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--chip);}
.cmpc{min-width:0;padding:12px 8px 13px;text-align:center;}
.cmpc+.cmpc{border-left:var(--bw) solid var(--line);}
.cmpc .lb{display:inline-block;margin-bottom:10px;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:800;background:var(--acc);color:var(--accFg);}
.cmpc.bad .lb{background:#AEB4BF;color:#fff;}
.cmpi{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:7px;}
.cmpi .e{font-size:24px;line-height:1;}
.cmpi .n{min-width:0;font-size:13px;font-weight:600;line-height:1.45;text-align:left;word-break:keep-all;text-wrap:balance;}
.cmpi .p{font-size:11.5px;font-weight:900;color:var(--acc);display:block;}
.cmpc.bad .cmpi .p{color:var(--sub);}
.cmpnote{margin-top:11px;padding-top:9px;border-top:1px dashed rgba(176,168,152,0.3);font-size:12px;line-height:1.65;font-weight:500;color:var(--sub);}
.rf{margin-top:16px;padding-top:12px;border-top:var(--bw) dashed var(--line);color:var(--sub);text-align:center;font-size:11px;font-weight:700;letter-spacing:.6px;}
.ad{display:none;}
.sheet{background:var(--paper);border:var(--bw) solid var(--line);border-radius:var(--r);overflow:hidden;}
.sheeth{padding:16px 18px;background:var(--acc);border-bottom:var(--bw) solid var(--line);text-align:center;}
.sheeth h2{margin:0;color:var(--accFg);font-size:18px;font-weight:800;letter-spacing:-.4px;}
.sheeth p{margin:5px 0 0;color:var(--accFg);opacity:.85;font-size:11.5px;font-weight:700;}
.reveal{margin:14px;padding:20px 16px;text-align:center;background:var(--soft);border:var(--bw) solid var(--line);border-radius:var(--r);}
.reveal .em{font-size:46px;line-height:1;}
.reveal .nm{margin-top:8px;font-size:19px;font-weight:700;line-height:1.45;text-wrap:balance;}
.reveal .eq{margin:9px 0 7px;font-size:13px;font-weight:800;color:var(--sub);}
.reveal .code{display:inline-block;padding:8px 22px;background:var(--acc);color:var(--accFg);border-radius:999px;font-size:26px;font-weight:800;letter-spacing:3px;}
.sheetad{display:none;}
.sheetsec{margin:0 14px 10px;padding:9px 12px;background:var(--deep);color:var(--deepFg);border:var(--bw) solid var(--line);border-radius:var(--r);font-size:12.5px;font-weight:900;text-align:center;}
.rows{margin:0 14px 14px;border:var(--bw) solid var(--line);border-radius:var(--r);overflow:hidden;}
.row{display:grid;grid-template-columns:26px 30px minmax(0,1fr) auto;align-items:center;gap:9px;padding:10px 11px;background:var(--chip);border-bottom:1px solid rgba(176,168,152,0.18);}
.row:last-child{border-bottom:0;}
.row.me{background:var(--soft);color:var(--softFg);}
.row .no{font-size:10px;font-weight:800;color:var(--sub);opacity:.7;}
.row .em{font-size:22px;line-height:1;text-align:center;}
.row .nm{font-size:14px;font-weight:600;line-height:1.45;min-width:0;word-break:keep-all;text-wrap:balance;}
.row .tg{display:block;font-size:10.5px;font-weight:700;color:var(--sub);opacity:.85;margin-top:2px;}
.row .cd{padding:4px 10px;border-radius:999px;background:var(--deep);font-size:11px;font-weight:800;letter-spacing:.8px;white-space:nowrap;}
.row.me .cd{background:var(--acc);color:var(--accFg);}
.mo{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(20,20,20,.82);overflow-y:auto;}
.mo.on{display:flex;}
.mb2{width:100%;max-width:360px;max-height:92vh;overflow:auto;padding:20px 16px;text-align:center;background:var(--paper);border:var(--bw) solid var(--line);border-radius:var(--r);margin:auto;}
.mb2 h3{margin:0 0 8px;font-size:18px;font-weight:900;}
.mb2 p{margin:0 0 16px;color:var(--sub);font-size:13px;line-height:1.55;font-weight:600;}
.mb2 img{display:block;width:100%;border:var(--bw) solid var(--line);border-radius:var(--r);}
.mbtns{display:grid;gap:8px;margin-top:14px;}
.mbtn{display:block;width:100%;padding:14px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--chip);color:var(--ink);font-family:var(--fb);font-size:14.5px;font-weight:600;text-align:center;text-decoration:none;cursor:pointer;box-sizing:border-box;}
.mbtn.pri{background:var(--acc);border-color:var(--acc);color:var(--accFg);}
.mtip{margin:12px 0 0!important;font-size:12px;line-height:1.6;color:var(--sub);}
.mb2 .cl{width:100%;min-height:46px;margin-top:14px;cursor:pointer;color:#fff;background:var(--line);border:var(--bw) solid var(--line);border-radius:var(--r);font-size:14px;font-weight:800;}
.tst{position:fixed;left:50%;bottom:26px;z-index:200;max-width:calc(100% - 32px);padding:12px 18px;color:#fff;background:rgba(28,28,28,.95);border:var(--bw) solid #fff;border-radius:var(--r);font-size:13.5px;font-weight:700;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;}
.tst.show{opacity:1;transform:translate(-50%,0);}
@media(hover:hover) and (pointer:fine){
.btn:hover{background:var(--soft);color:var(--softFg);}
.btn.fill:hover{opacity:.9;background:var(--acc);}
.op:hover{background:var(--soft);color:var(--softFg);}
.op:hover::before{color:var(--ink);}
.qback:hover{color:var(--ink);}
}
@media(max-width:520px){.app{padding:18px 11px 38px;}.intro{padding:28px 14px 20px;}.intro h1{font-size:22px;}
.ci .n{font-size:9.5px;} .ci .e{font-size:19px;}
.qw{padding:20px 15px 24px;}.qx{font-size:19px;min-height:66px;}
.op{min-height:64px;padding:13px 13px 13px 48px;font-size:14px;}
.tc{min-height:74px;font-size:11.5px;}.rn h3{font-size:26px;}.rh h2{font-size:14px;}
.dls{gap:6px 7px;padding:10px 9px;}.dit{font-size:11.5px;}.cds{gap:7px;}}

}else{var p=pm[c.type]||0;var bg=tint(color,p);var fg=readable(bg);
g+='<div class="mapc" style="background:'+bg+';color:'+fg+'">'+
'<span class="e">'+c.emoji+'</span><span class="n">'+esc(c.name)+'</span>'+
'<span class="p" style="opacity:1">'+p+'%</span></div>';}}
var bar="linear-gradient(90deg,"+tint(color,72)+","+tint(color,99)+")";
return '<div class="map"><div class="maph">'+esc(L.mapTitle||"나의 궁합 지도")+'</div>'+
'<div class="mapg">'+g+'</div>'+
'<div class="mapf"><span>안 맞음</span><span class="mapbar" style="background:'+bar+'"></span>'+
'<span>잘 맞음</span></div></div>';}
function blockHTML(name,r){
if(name==="quote"&&r.quote){var qcls=D.quoteStyle==="bubble"?"qbb":"qb";
return '<div class="blk"><div class="blt">'+esc(lab("quote")||"한마디")+'</div>'+
'<div class="'+qcls+'">'+esc(r.quote)+'</div></div>';}
if(name==="traits"&&r.traits&&r.traits.length){var h='<div class="blk"><div class="blt">'+
esc(lab("traits")||"세부 특징")+'</div>';
if(D.traitStyle==="sticker"){h+='<div class="trss">';
for(var i=0;i<r.traits.length;i++){h+='<div class="tst">'+esc(r.traits[i])+'</div>';}
h+='</div>';
}else{h+='<div class="trs">';
for(var i2=0;i2<r.traits.length;i2++){h+='<div class="tc">'+esc(r.traits[i2])+'</div>';}
h+='</div>';}
return h+"</div>";}
if(name==="duo"&&r.duo){var g=r.duo.good||[],b=r.duo.bad||[];var chk=D.duoStyle==="check";
var gm=chk?"✓":"",bm=chk?"✗":"",dcls=chk?" chk":"";
var h2='<div class="blk duo"><div class="dsec g"><div class="dsh">'+esc(lab("duo","good")||"좋은 면")+'</div><div class="dls">';
for(var j=0;j<g.length;j++){h2+='<div class="dit'+dcls+'"><b>'+gm+'</b><span>'+esc(g[j])+'</span></div>';}
h2+='</div></div><div class="dsec b"><div class="dsh">'+esc(lab("duo","bad")||"아쉬운 면")+'</div><div class="dls">';
for(var k2=0;k2<b.length;k2++){h2+='<div class="dit'+dcls+'"><b>'+bm+'</b><span>'+esc(b[k2])+'</span></div>';}
return h2+"</div></div></div>";}
if(name==="stats"&&r.stats&&r.stats.length){
var h3='<div class="blk"><div class="blt">'+esc(lab("stats")||"지표")+'</div>';
if(D.statStyle==="radial"){
h3+='<div class="stsr">';
for(var m=0;m<r.stats.length;m++){var s=r.stats[m];var v=Math.max(0,Math.min(100,s.value||0));
var C=100.53;var off=C*(1-v/100);
h3+='<div class="rgauge"><svg viewBox="0 0 38 38">'+
'<circle class="rtrack" cx="19" cy="19" r="16"/>'+
'<circle class="rfill" cx="19" cy="19" r="16" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" transform="rotate(-90 19 19)"/>'+
'<text x="19" y="23" text-anchor="middle" style="font-size:10px;font-weight:900;fill:var(--ink)">'+v+'%</text>'+
'</svg><div class="rlab">'+esc(s.label)+'</div></div>';}
h3+='</div>';
}else{
h3+='<div class="sts">';
for(var m2=0;m2<r.stats.length;m2++){var s2=r.stats[m2];var v2=Math.max(0,Math.min(100,s2.value||0));
var fc=Math.max(1,Math.min(10,Math.round(v2/10)));var sq="";
for(var n2=1;n2<=10;n2++){sq+='<span class="sq'+(n2<=fc?" f":"")+'"></span>';}
h3+='<div class="srow"><div class="slab">'+esc(s2.label)+'</div><div class="sqs">'+sq+'</div>'+
'<div class="spc">'+v2+'%</div></div>';}
h3+='</div>';
}
return h3+"</div>";}
if(name==="cards"&&r.cards&&r.cards.length){
var h4='<div class="blk"><div class="blt">'+esc(lab("cards")||"이런 사람")+'</div>';
if(D.cardStyle==="ticket"){h4+='<div class="cdt">';
for(var p=0;p<r.cards.length;p++){h4+='<div class="cdti"><b>'+esc(r.cards[p].label)+'</b><span>'+
esc(r.cards[p].value)+'</span></div>';}
h4+='</div>';
}else{h4+='<div class="cds" style="margin-top:9px">';
for(var p2=0;p2<r.cards.length;p2++){h4+='<div class="cd2"><b>'+esc(r.cards[p2].label)+'</b><p>'+
esc(r.cards[p2].value)+'</p></div>';}
h4+='</div>';}
return h4+"</div>";}
return "";}
function result(code){var r=null;
for(var i=0;i<D.results.length;i++){if(D.results[i].type===code){r=D.results[i];break;}}
if(!r)r=D.results[0];
setAcc(r.color||D.accent);
var sum=(nick?esc(nick)+"님은 ":"")+esc(r.summary);
var h='<div class="cap" id="cap"><div class="rh"><h2>'+esc(D.meta.title)+'</h2></div><div class="rb">'+
'<div class="rn"><div class="em">'+esc(r.emoji||"✨")+'</div><h3>'+esc(r.name||D.meta.title)+'</h3>'+
(r.tagline?'<div class="tg2">'+esc(r.tagline)+'</div>':"")+'</div>'+
'<div class="rs">'+sum+'</div>';
var col=r.color||D.accent;
for(var b=0;b<D.blocks.length;b++){if(D.blocks[b]!=="map")h+=blockHTML(D.blocks[b],r);}
h+=compatHTML(r.type);
if(D.blocks.indexOf("map")>=0)h+=mapHTML(r.type,col);
h+='<div class="rf">POWERED BY MAGIC FACTORY</div></div></div>'+
'<div class="stk"><button class="btn fill" onclick="sheet(\''+code+'\')">'+
esc(D.meta.sheetCta||"내 유형의 정체 확인하기")+'</button>'+
'<button class="btn" onclick="saveImg(this)">결과 이미지 저장하기</button>'+
'<button class="btn" onclick="share()">테스트 공유하기</button>'+
'<button class="btn" onclick="intro()">다시 해보기</button></div>';
$("s5").innerHTML=h;}
function sheet(code){var me=byType(code)||D.cast[0];
var rows="";
for(var i=0;i<D.cast.length;i++){var c=D.cast[i];var isMe=c.type===code;
if(i===8){rows+='</div><div class="sheetad">광고 영역 (애드센스 코드 삽입 위치)</div><div class="rows">';}
rows+='<div class="row'+(isMe?" me":"")+'"><span class="no">'+("0"+(i+1)).slice(-2)+'</span>'+
'<span class="em">'+c.emoji+'</span>'+
'<span class="nm">'+esc(c.name)+(c.tagline?'<span class="tg">'+esc(c.tagline)+'</span>':"")+'</span>'+
'<span class="cd">'+esc(c.type)+'</span></div>';}
$("s6").innerHTML='<div class="sheet">'+
'<div class="sheeth"><h2>'+esc(D.meta.sheetTitle||"전체 유형 정답지")+'</h2>'+
'<p>열여섯 종류가 각각 어떤 성격 유형인지 전부 공개해요</p></div>'+
'<div class="reveal"><div class="em">'+me.emoji+'</div>'+
'<div class="nm">'+(nick?esc(nick)+"님의 ":"")+esc(me.name)+'</div>'+
'<div class="eq">의 성격 유형은</div>'+
'<div class="code">'+esc(me.type)+'</div></div>'+
'<div class="sheetad">광고 영역 (애드센스 코드 삽입 위치)</div>'+
'<div class="sheetsec">'+esc(D.meta.setName||"전체 16종")+' 전체 목록</div>'+
'<div class="rows">'+rows+'</div>'+
'<div class="sheetad">광고 영역 (애드센스 코드 삽입 위치)</div>'+
'</div>'+
'<div class="stk"><button class="btn fill" onclick="show(\'s5\')">내 결과로 돌아가기</button>'+
'<button class="btn" onclick="share()">테스트 공유하기</button>'+
'<button class="btn" onclick="intro()">다시 해보기</button></div>';
show("s6");}
function frames(){return new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r);});});}
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
var lastBlob=null,lastUrl="";
function fileName(){return (D.meta.slug||"result")+".png";}
function saveOptions(){
var canShare=false;
try{canShare=!!(navigator.canShare&&lastBlob&&navigator.canShare({files:[new File([lastBlob],fileName(),{type:"image/png"})]}));}catch(e){}
var h="";
if(canShare)h+='<button class="mbtn pri" onclick="shareImg()">사진으로 저장 · 공유</button>';
else h+='<p class="mtip" style="margin:0 0 10px;">위 이미지를 <b>길게 눌러서 사진에 저장</b>해 주세요.</p>';
h+='<a class="mbtn" href="'+lastUrl+'" download="'+fileName()+'" target="_blank" rel="noopener">새 탭에서 이미지 열기</a>';
return '<div class="mbtns">'+h+'</div>'+
'<p class="mtip">"이미지 열기"를 눌렀을 때 저장이 안 되면, 위 이미지를 직접 길게 눌러 저장해 주세요.</p>';}
async function shareImg(){
try{var f=new File([lastBlob],fileName(),{type:"image/png"});
await navigator.share({files:[f],title:D.meta.title});}
catch(e){if(e&&e.name!=="AbortError")toast("공유를 취소했거나 지원되지 않아요.");}}
async function saveImg(btn){
if(typeof html2canvas!=="function"){toast("이미지 도구를 불러오지 못했어요. 새로고침 후 다시 시도해 주세요.");return;}
btn.disabled=true;var old=btn.textContent;btn.textContent="이미지 만드는 중...";
$("mw").innerHTML='<p style="padding:40px 0;">이미지를 만들고 있어요...</p>';
$("mo").classList.add("on");document.body.style.overflow="hidden";
try{
if(document.fonts){try{await document.fonts.ready;}catch(e){}}
await frames();await wait(260);
var cv=await html2canvas($("cap"),{backgroundColor:getComputedStyle(document.body).backgroundColor,
scale:Math.min(window.devicePixelRatio||2,2),useCORS:true,logging:false,
scrollX:0,scrollY:-window.scrollY,windowWidth:document.documentElement.clientWidth});
if(lastUrl&&lastUrl.indexOf("blob:")===0){try{URL.revokeObjectURL(lastUrl);}catch(e){}}
var dataUrl=cv.toDataURL("image/png");
lastBlob=await new Promise(function(res){
if(cv.toBlob)cv.toBlob(function(b){res(b);},"image/png");else res(null);});
if(!lastBlob){
  var bin=atob(dataUrl.split(",")[1]),arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  lastBlob=new Blob([arr],{type:"image/png"});}
lastUrl=dataUrl;
$("mw").innerHTML='<img src="'+lastUrl+'" alt="결과 이미지">'+saveOptions();
}catch(e){console.error(e);
$("mw").innerHTML='<p style="padding:32px 0 8px;">이미지를 만들지 못했어요.<br>'+
'대신 화면을 캡처해서 공유해 주세요.</p>'+
'<p class="mtip">오류: '+esc(String(e&&e.message||e))+'</p>';
}finally{btn.disabled=false;btn.textContent=old;}}
function closeMo(){$("mo").classList.remove("on");document.body.style.overflow="";}
$("mo").addEventListener("click",function(e){if(e.target===$("mo"))closeMo();});
document.addEventListener("keydown",function(e){
if(e.key==="Escape"&&$("mo").classList.contains("on"))closeMo();});
async function share(){var dt={title:D.meta.title,text:D.meta.intro,url:location.href};
try{if(navigator.share){await navigator.share(dt);return;}
var tx=dt.text+"\n"+dt.url;
if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(tx);
toast("링크를 복사했어요.");return;}
var ta=document.createElement("textarea");ta.value=tx;ta.style.position="fixed";ta.style.opacity="0";
document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();
toast("링크를 복사했어요.");}catch(e){if(e&&e.name!=="AbortError")toast("공유하지 못했어요.");}}
function toast(m){clearTimeout(tT);var e=$("tst");e.textContent=m;e.classList.add("show");
tT=setTimeout(function(){e.classList.remove("show");},2100);}
intro();
</script>
</body>
</html>
