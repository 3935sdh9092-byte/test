var curLang = 'ko';

function daysAgo(dateStr){
  var d = new Date(dateStr+"T00:00:00");
  var diff = Math.floor((Date.now()-d.getTime())/86400000);
  return diff;
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}

function sorted(){
  return TESTS.slice().sort(function(a,b){
    var pa = a.pinned ? 1 : 0, pb = b.pinned ? 1 : 0;
    if(pa !== pb) return pb - pa;
    return (b.date||'').localeCompare(a.date||'');
  });
}

function titleFor(t){
  var key = I18N[curLang].titleKey;
  return t[key] || t.title;
}

var CAT_EN = { mbti:'mbti', saju:'saju', quiz:'quiz', balance:'balance' };

function metaFor(t){
  var cat = t.category;
  if(cat === 'mbti')    return [['Type','MBTI'],['Q','12'],['Result','16종']];
  if(cat === 'saju')    return [['Type','사주'],['방식','입력형'],['Result','오행']];
  if(cat === 'quiz')    return [['Type','퀴즈'],['Q', String(t.q||10)],['Result','5단계']];
  if(cat === 'balance') return [['Type','밸런스'],['Round', String(t.q||12)],['통계','실시간']];
  if(cat === 'group')   return [['Type','그룹'],['Q','12'],['지도','실시간']];
  return [['Type', cat||'-'],['-','-'],['-','-']];
}

function isNewTest(dateStr){
  return daysAgo(dateStr) <= 14;
}

function barcodeHTML(seed){
  seed = seed || 'x';
  var s = 0;
  for(var i=0;i<seed.length;i++){ s = (s*31 + seed.charCodeAt(i)) >>> 0; }
  function rand(){ s = (s*1103515245 + 12345) >>> 0; return (s % 1000)/1000; }
  var bars = '';
  for(var i=0;i<26;i++){
    var h = 30 + Math.floor(rand()*70);
    bars += '<span style="height:'+h+'%"></span>';
  }
  return bars;
}

function render(list){
  var grid = document.getElementById('grid');
  var count = document.getElementById('count');
  count.textContent = I18N[curLang].count(list.length);
  if(!list.length){
    grid.innerHTML = '<div class="empty">'+I18N[curLang].empty+'</div>';
    return;
  }
  grid.innerHTML = list.map(function(t){
    var m = metaFor(t);
    var metaHtml = m.map(function(p){
      return '<div class="tmeta-item"><div class="tmeta-label">'+esc(p[0])+'</div><div class="tmeta-val">'+esc(p[1])+'</div></div>';
    }).join('');
    return '<a class="ticket" href="'+esc(t.file)+'">'+
      '<div class="poster">'+
        (t.thumb ? '<img src="'+esc(t.thumb)+'" alt="'+esc(titleFor(t))+'" loading="lazy">' : '')+
        (isNewTest(t.date) ? '<div class="poster-new">NEW</div>' : '')+
        '<div class="poster-cat">'+esc(catLabel(t.category))+'</div>'+
        '<div class="poster-overlay">'+
          '<div class="poster-cat-sm">'+esc(CAT_EN[t.category]||t.category||'')+'</div>'+
          '<div class="poster-title">'+esc(titleFor(t))+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="notch"><div class="notch-left"></div><div class="notch-dash"></div><div class="notch-right"></div></div>'+
      '<div class="info">'+
        '<div class="tmeta">'+metaHtml+'</div>'+
        '<div class="barcode">'+barcodeHTML(t.file)+'</div>'+
      '</div>'+
    '</a>';
  }).join('');
}

var ALL = sorted();
var curCat = 'all';

function catLabel(cat){
  if(cat === 'all') return I18N[curLang].catAll;
  return (I18N[curLang].catLabels && I18N[curLang].catLabels[cat]) || cat;
}

function applyFilter(){
  var v = document.getElementById('q').value.trim().toLowerCase();
  var list = ALL.filter(function(t){
    var okCat = curCat === 'all' || t.category === curCat;
    var okSearch = !v || titleFor(t).toLowerCase().indexOf(v) >= 0;
    return okCat && okSearch;
  });
  render(list);
}

function renderCatTabs(){
  var cats = ['all'];
  ALL.forEach(function(t){
    if(t.category && cats.indexOf(t.category) < 0) cats.push(t.category);
  });
  var box = document.getElementById('catrow');
  box.innerHTML = cats.map(function(c){
    return '<button type="button" data-cat="'+c+'" class="'+(c===curCat?'cur':'')+'">'+esc(catLabel(c))+'</button>';
  }).join('');
  box.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){
      curCat = b.dataset.cat;
      box.querySelectorAll('button').forEach(function(x){ x.classList.toggle('cur', x.dataset.cat === curCat); });
      applyFilter();
    });
  });
}

function applyLang(lang){
  curLang = lang;
  var d = I18N[lang];
  document.getElementById('t-desc').innerHTML = d.desc;
  document.getElementById('t-about').innerHTML = d.about;
  document.getElementById('q').placeholder = d.search;
  document.getElementById('t-footer').innerHTML = d.footer;
  document.querySelectorAll('.langs button').forEach(function(b){
    b.classList.toggle('cur', b.dataset.lang === lang);
  });
  renderCatTabs();
  applyFilter();
}

document.getElementById('q').addEventListener('input', applyFilter);

(function(){
  var LANGS = [{code:'ko',label:'한국어'},{code:'en',label:'EN'},{code:'ja',label:'日本語'},{code:'zh',label:'中文'}];
  var box = document.getElementById('langs');
  box.innerHTML = LANGS.map(function(l){
    return '<button type="button" data-lang="'+l.code+'" class="'+(l.code==='ko'?'cur':'')+'">'+l.label+'</button>';
  }).join('');
  box.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ applyLang(b.dataset.lang); });
  });
})();

applyLang('ko');
</script>
