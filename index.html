:root{
  --bg:#FFFFFF;
  --ink:#111111;
  --sub:#767676;
  --faint:#B8B8B8;
}
*{box-sizing:border-box;}
html{background:#FFFFFF;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
a{color:inherit;text-decoration:none;}

.wrap{max-width:1100px;margin:0 auto;padding:0 24px;}

/* ===== 히어로 ===== */
.hero{padding:44px 0 0;}
.mark{
  font-size:clamp(52px,11vw,128px);
  font-weight:900;
  letter-spacing:-3px;
  line-height:.92;
  margin:0;
  white-space:nowrap;
}
.mark .colon{color:var(--faint);padding:0 2px;}
.rule{border:0;border-top:2px solid var(--ink);margin:18px 0 0;}
.subrow{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:18px 0 40px;flex-wrap:wrap;}
.desc{font-size:15px;line-height:1.65;color:var(--ink);max-width:520px;margin:0;font-weight:500;}
.desc b{font-weight:800;}
.nav{display:flex;align-items:center;gap:16px;font-size:13.5px;font-weight:700;color:var(--sub);white-space:nowrap;padding-top:2px;}
.nav a{display:flex;align-items:center;gap:5px;}
.nav a:hover{color:var(--ink);}
.langs{display:flex;gap:2px;border-left:1px solid #E5E5E5;padding-left:14px;}
.langs button{padding:3px 7px;border-radius:5px;font-weight:700;font-size:13px;background:none;border:0;cursor:pointer;color:var(--sub);font-family:inherit;}
.langs button:hover{background:#F1F1F1;color:var(--ink);}
.langs button.cur{color:var(--ink);text-decoration:underline;text-underline-offset:3px;}

.searchrow{padding:0 0 20px;}
.searchrow input{
  width:100%;max-width:320px;padding:10px 4px;border:0;border-bottom:2px solid var(--ink);
  font-size:14px;font-family:inherit;font-weight:600;background:transparent;
}
.searchrow input::placeholder{color:var(--faint);font-weight:500;}

.catrow{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:28px;}
.catrow button{
  padding:8px 16px;border:2px solid var(--ink);border-radius:999px;background:var(--bg);
  font-family:inherit;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--ink);
  transition:background .12s ease,color .12s ease;
}
.catrow button:hover{background:#F1F1F1;}
.catrow button.cur{background:var(--ink);color:#fff;}

/* ===== 그리드 ===== */
main{padding-bottom:70px;}
.count{font-size:12.5px;font-weight:700;color:var(--faint);margin:0 0 18px;text-transform:uppercase;letter-spacing:.4px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:26px 16px;}

/* ===== 폴더 카드 (작게, 썸네일이 안에 낀 느낌) ===== */
.card{display:block;}
.folder{
  position:relative;
  aspect-ratio:5/4;
  margin-bottom:10px;
  margin-top:14%;
}
.folder .back{
  position:absolute;left:3%;right:3%;top:5px;bottom:-2px;
  background:rgba(17,17,17,.06);
  border-radius:4px 10px 10px 10px;
  clip-path:polygon(0% 16%,12% 16%,17% 3%,44% 3%,49% 16%,100% 16%,100% 100%,0% 100%);
  z-index:1;
}
.folder .peek{
  position:absolute;
  left:18%;right:18%;top:-16%;height:50%;
  background-size:cover;background-position:center;
  border:3px solid #fff;border-radius:5px;
  box-shadow:0 4px 10px rgba(17,17,17,.22);
  transform:rotate(-5deg);
  z-index:2;
  transition:transform .16s ease;
}
.card:hover .peek{transform:rotate(-7deg) translateY(-2px);}
.folder .face{
  position:absolute;inset:0;
  background:var(--fc,#FFE066);
  border-radius:4px 10px 10px 10px;
  clip-path:polygon(0% 16%,12% 16%,17% 3%,44% 3%,49% 16%,100% 16%,100% 100%,0% 100%);
  box-shadow:0 7px 16px -8px rgba(17,17,17,.35);
  transition:transform .16s ease, box-shadow .16s ease;
  z-index:3;
  display:flex;align-items:center;justify-content:center;
}
.card:hover .face{transform:translateY(-3px);box-shadow:0 12px 20px -8px rgba(17,17,17,.4);}
.folder.has-thumb .face .emoji{display:none;}
.folder .emoji{font-size:26px;line-height:1;}

.meta{display:flex;align-items:baseline;justify-content:space-between;gap:6px;}
.label{font-size:13px;font-weight:800;line-height:1.35;letter-spacing:-.2px;}
.new{font-size:9px;font-weight:900;color:var(--ink);background:#FFE066;padding:2px 5px;border-radius:4px;flex-shrink:0;}
.date{font-size:10.5px;color:var(--faint);font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;}

.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--sub);font-weight:600;font-size:14px;}

footer{border-top:1px solid #ECECEC;padding:22px 0 40px;text-align:center;font-size:12.5px;color:var(--sub);font-weight:600;}
footer a{text-decoration:underline;text-underline-offset:2px;}
footer a:hover{color:var(--ink);}

@media(max-width:560px){
  .grid{grid-template-columns:repeat(3,1fr);gap:20px 10px;}
  .subrow{padding-bottom:28px;}
  .label{font-size:11.5px;}
}
</style>

var curLang = 'ko';

function daysAgo(dateStr){
  var d = new Date(dateStr+"T00:00:00");
  var diff = Math.floor((Date.now()-d.getTime())/86400000);
  return diff;
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}

function sorted(){
  return TESTS.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
}

function titleFor(t){
  var key = I18N[curLang].titleKey;
  return t[key] || t.title;
}

function render(list){
  var grid = document.getElementById('grid');
  var count = document.getElementById('count');
  count.textContent = I18N[curLang].count(list.length);
  if(!list.length){
    grid.innerHTML = '<div class="empty">'+I18N[curLang].empty+'</div>';
    return;
  }
  grid.innerHTML = list.map(function(t, i){
    var color = t.color || PALETTE[i % PALETTE.length];
    var isNew = daysAgo(t.date) <= 3;
    return '<a class="card" href="'+esc(t.file)+'">'+
      '<div class="folder">'+
        '<div class="back"></div>'+
        '<div class="face" style="--fc:'+color+'"><span class="emoji">'+esc(t.emoji||'✨')+'</span></div>'+
      '</div>'+
      '<div class="meta">'+
        '<span class="label">'+esc(titleFor(t))+'</span>'+
        (isNew ? '<span class="new">NEW</span>' : '')+
      '</div>'+
      '<div class="date">'+esc(t.date)+'</div>'+
    '</a>';
  }).join('');

  /* 썸네일이 있는 카드만 미리 로드해보고, 성공한 것만 폴더 위로 살짝 얹음 (실패하면 색+이모지 그대로 유지) */
  var cards = grid.querySelectorAll('.card');
  list.forEach(function(t, i){
    if(!t.thumb) return;
    var img = new Image();
    img.onload = function(){
      var card = cards[i];
      if(!card) return;
      var folder = card.querySelector('.folder');
      var face = folder.querySelector('.face');
      var peek = document.createElement('div');
      peek.className = 'peek';
      peek.style.backgroundImage = 'url("'+t.thumb.replace(/"/g,'')+'")';
      folder.insertBefore(peek, face);
      folder.classList.add('has-thumb');
    };
    img.src = t.thumb;
  });
}

var ALL = sorted();
var curCat = 'all';

function catLabel(cat){
  if(cat === 'all') return I18N[curLang].catAll;
  return (I18N[curLang].catLabels && I18N[curLang].catLabels[cat]) || cat;
}

function applyFilter(){
  var v = document.getElementById('q').value.trim().toLowerCase();
  var list = ALL.filter(function(t){
    var okCat = curCat === 'all' || t.category === curCat;
    var okSearch = !v || titleFor(t).toLowerCase().indexOf(v) >= 0;
    return okCat && okSearch;
  });
  render(list);
}

function renderCatTabs(){
  var cats = ['all'];
  ALL.forEach(function(t){
    if(t.category && cats.indexOf(t.category) < 0) cats.push(t.category);
  });
  var box = document.getElementById('catrow');
  box.innerHTML = cats.map(function(c){
    return '<button type="button" data-cat="'+c+'" class="'+(c===curCat?'cur':'')+'">'+esc(catLabel(c))+'</button>';
  }).join('');
  box.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){
      curCat = b.dataset.cat;
      box.querySelectorAll('button').forEach(function(x){ x.classList.toggle('cur', x.dataset.cat === curCat); });
      applyFilter();
    });
  });
}

function applyLang(lang){
  curLang = lang;
  var d = I18N[lang];
  document.getElementById('t-desc').innerHTML = d.desc;
  document.getElementById('t-about').innerHTML = d.about;
  document.getElementById('q').placeholder = d.search;
  document.getElementById('t-footer').innerHTML = d.footer;
  document.querySelectorAll('.langs button').forEach(function(b){
    b.classList.toggle('cur', b.dataset.lang === lang);
  });
  renderCatTabs();
  applyFilter();
}

document.getElementById('q').addEventListener('input', applyFilter);

(function(){
  var LANGS = [{code:'ko',label:'한국어'},{code:'en',label:'EN'},{code:'ja',label:'日本語'},{code:'zh',label:'中文'}];
  var box = document.getElementById('langs');
  box.innerHTML = LANGS.map(function(l){
    return '<button type="button" data-lang="'+l.code+'" class="'+(l.code==='ko'?'cur':'')+'">'+l.label+'</button>';
  }).join('');
  box.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){ applyLang(b.dataset.lang); });
  });
})();

applyLang('ko');
