<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나는 얼마나 츤데레일까? 츤데레 지수 테스트 — 테스트팩토리</title>
<meta name="description" content="속마음은 다정한데 표현은 삐딱한 편? 9가지 상황으로 알아보는 나의 츤데레 지수.">
<meta property="og:title" content="나는 얼마나 츤데레일까? 츤데레 지수 테스트 — 테스트팩토리">
<meta property="og:description" content="속마음은 다정한데 표현은 삐딱한 편? 9가지 상황으로 알아보는 나의 츤데레 지수.">
<meta property="og:image" content="tsundere-quiz-thumb.png">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4595078545343262" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#F3F0FF; --paper:#FFFFFF; --ink:#211C33; --sub:#6B647F;
  --line:#DCD3F5; --acc:#7C5CFC; --chip:rgba(0,0,0,.06); --r:14px; --bw:2px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;min-height:100vh;}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 80px;}
.back{display:inline-block;margin-bottom:18px;font-size:13px;font-weight:700;color:var(--sub);text-decoration:none;}
.hero{text-align:center;padding:16px 0 24px;}
.hero .em{font-size:52px;line-height:1;margin-bottom:12px;}
.hero h1{font-size:23px;font-weight:900;margin-bottom:8px;letter-spacing:-.3px;}
.hero p{font-size:14px;color:var(--sub);line-height:1.65;}
.start-btn{width:100%;padding:16px;border:0;border-radius:var(--r);background:var(--acc);color:#fff;
  font-family:inherit;font-size:16px;font-weight:900;cursor:pointer;margin-top:20px;}
.prog-wrap{margin-bottom:20px;}
.prog-info{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:8px;color:var(--sub);}
.prog-track{height:8px;background:var(--chip);border-radius:999px;overflow:hidden;border:var(--bw) solid var(--line);}
.prog-fill{height:100%;background:var(--acc);border-radius:999px;transition:width .25s ease;}
.qcard{background:var(--paper);border:var(--bw) solid var(--line);border-radius:var(--r);padding:22px 18px;}
.qnum{display:inline-block;padding:4px 10px;background:var(--acc);color:#fff;border-radius:999px;
  font-size:11px;font-weight:800;margin-bottom:14px;}
.qtext{font-size:18px;font-weight:800;line-height:1.5;margin-bottom:18px;word-break:keep-all;}
.opts{display:grid;gap:10px;}
.opt{width:100%;padding:13px 15px;border:var(--bw) solid var(--line);border-radius:10px;
  background:#fff;font-family:inherit;font-size:14px;font-weight:600;text-align:left;cursor:pointer;
  color:var(--ink);transition:all .15s ease;word-break:keep-all;}
.opt:hover{background:var(--chip);border-color:var(--acc);}
.opt.correct{background:#D1FAE5;border-color:#10B981;color:#065F46;}
.opt.wrong{background:#FEE2E2;border-color:#EF4444;color:#991B1B;}
.opt:disabled{cursor:default;}
#cap{background:var(--paper);border:var(--bw) solid var(--line);border-radius:var(--r);padding:22px 18px;margin-bottom:16px;}
.res-header{text-align:center;padding:18px 0 14px;border-bottom:var(--bw) solid var(--line);margin-bottom:18px;}
.res-grade{display:inline-block;padding:6px 18px;background:var(--acc);color:#fff;border-radius:999px;
  font-size:13px;font-weight:900;margin-bottom:12px;}
.res-score{font-size:42px;font-weight:900;color:var(--acc);margin-bottom:4px;}
.res-score span{font-size:18px;color:var(--sub);}
.res-title{font-size:22px;font-weight:900;margin-bottom:8px;}
.res-desc{font-size:14.5px;line-height:1.75;color:var(--sub);}
.score-bar-wrap{margin:18px 0;}
.score-bar-label{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px;}
.score-bar-track{height:14px;background:var(--chip);border-radius:999px;overflow:hidden;border:var(--bw) solid var(--line);}
.score-bar-fill{height:100%;background:var(--acc);border-radius:999px;transition:width .5s ease;}
.wrong-list{margin-top:16px;}
.wrong-title{font-size:13px;font-weight:800;color:var(--sub);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line);}
.wrong-item{padding:10px 12px;background:var(--chip);border-radius:10px;margin-bottom:8px;font-size:13px;line-height:1.6;}
.wrong-item .wq{font-weight:700;margin-bottom:4px;}
.wrong-item .wa{color:var(--acc);font-weight:800;}
.footer-note{font-size:11px;color:var(--sub);text-align:center;margin-top:16px;}
.stk{display:grid;gap:10px;}
.btn{width:100%;padding:14px;border:var(--bw) solid var(--ink);border-radius:var(--r);background:#fff;
  font-family:inherit;font-weight:800;font-size:14.5px;cursor:pointer;color:var(--ink);}
.btn.fill{background:var(--acc);color:#fff;border-color:var(--acc);}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:20px;}
.mo.on{display:flex;}
.mb{background:#fff;border-radius:16px;padding:20px;max-width:340px;width:100%;text-align:center;}
.mb img{width:100%;border-radius:10px;margin-bottom:12px;}
.mb .cl{width:100%;padding:12px;border:0;border-radius:10px;background:var(--chip);font-family:inherit;font-weight:800;cursor:pointer;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 목록으로</a>
  <div id="s1">
    <div class="hero">
      <div class="em">😤</div>
      <h1>나는 얼마나 츤데레일까?</h1>
      <p>속마음은 다정한데 표현은 삐딱한 편? 9가지 상황으로 알아보는 나의 츤데레 지수.</p>
      <button class="start-btn" onclick="startQuiz()">테스트 시작하기</button>
    </div>
  </div>
  <div id="s2" class="hidden">
    <div class="prog-wrap">
      <div class="prog-info"><span id="progLabel">1 / 9</span><span id="progScore">0점</span></div>
      <div class="prog-track"><div class="prog-fill" id="progFill" style="width:11%"></div></div>
    </div>
    <div class="qcard">
      <div class="qnum" id="qNum">Q1</div>
      <div class="qtext" id="qText"></div>
      <div class="opts" id="opts"></div>
    </div>
  </div>
  <div id="s3" class="hidden">
    <div id="cap">
      <div class="res-header">
        <div class="res-grade" id="resGrade"></div>
        <div class="res-score" id="resScore"></div>
        <div class="res-title" id="resTitle"></div>
        <div class="res-desc" id="resDesc"></div>
        <div class="score-bar-wrap">
          <div class="score-bar-label"><span>0점</span><span id="resMax"></span></div>
          <div class="score-bar-track"><div class="score-bar-fill" id="resBar"></div></div>
        </div>
      </div>
      <div class="wrong-list" id="wrongList"></div>
      <div class="footer-note">POWERED BY 테스트팩토리 · 재미로 보는 참고용 테스트예요.</div>
    </div>
    <div class="stk">
      <button class="btn fill" onclick="saveImg()">결과 이미지 저장하기</button>
      <button class="btn" onclick="location.reload()">다시 풀기</button>
      <button class="btn" onclick="location.href='index.html'">다른 테스트 보기</button>
    </div>
  </div>
</div>
<div class="mo" id="mo">
  <div class="mb">
    <div id="mw">이미지를 만들고 있어요...</div>
    <button class="cl" onclick="document.getElementById('mo').classList.remove('on')">닫기</button>
  </div>
</div>
<script>
var QUESTIONS = [
{"q": "좋아하는 사람에게 먼저 연락이 왔을 때 내 반응은?", "options": ["속으로는 좋으면서 답장은 일부러 늦게 한다", "바로 반갑게 답장한다", "괜히 무심한 척 짧게 답한다", "왜 연락했냐고 되묻는다"], "scores": [9, 2, 8, 6]},
{"q": "상대가 나를 칭찬했을 때 나는?", "options": ["괜히 민망해서 딴소리로 화제를 돌린다", "고맙다고 솔직하게 말한다", "장난스럽게 받아친다", "속으로만 좋아하고 티는 안 낸다"], "scores": [9, 2, 6, 8]},
{"q": "좋아하는 사람 앞에서 실수를 했을 때 나는?", "options": ["오히려 더 퉁명스럽게 군다", "바로 미안하다고 사과한다", "웃으면서 자연스럽게 넘긴다", "괜히 상황 탓을 하며 넘어간다"], "scores": [9, 2, 4, 7]},
{"q": "상대가 다른 사람과 친하게 지내는 걸 볼 때 나는?", "options": ["신경 쓰이지만 안 그런 척한다", "솔직하게 질투난다고 말한다", "괜히 무심한 티를 낸다", "쿨하게 넘긴다"], "scores": [9, 3, 7, 2]},
{"q": "내가 좋아하는 티가 나는 순간은?", "options": ["거의 없다, 철벽 방어 중이다", "가끔 나도 모르게 티가 난다", "친한 친구들은 이미 다 눈치챘다", "상대도 이미 알고 있을 것 같다"], "scores": [10, 7, 5, 2]},
{"q": "선물을 받았을 때 내 반응은?", "options": ["뭐 이런 걸 다 샀냐며 툴툴댄다", "엄청 좋아하며 고맙다고 표현한다", "안 받아도 되는데, 하면서도 잘 챙긴다", "바로 답례를 준비한다"], "scores": [8, 2, 9, 4]},
{"q": "다투고 나서 화해할 때 나는?", "options": ["먼저 연락은 하지만 퉁명스럽게 한다", "바로 사과하고 마음을 푼다", "상대가 먼저 연락할 때까지 기다린다", "아무 일 없던 척 자연스럽게 넘어간다"], "scores": [8, 2, 7, 6]},
{"q": "내 마음을 들켰을 때 나는?", "options": ["당황해서 아니라고 부정부터 한다", "쿨하게 인정한다", "장난이었다고 둘러댄다", "오히려 더 츤츤거리며 삐딱해진다"], "scores": [9, 2, 7, 8]},
{"q": "연락이 뜸할 때 내 속마음은?", "options": ["신경 쓰이면서도 먼저 연락은 안 한다", "바로 무슨 일 있냐고 물어본다", "괜히 다른 일에 집중하는 척한다", "기다리다 지쳐서 혼자 삐진다"], "scores": [9, 2, 7, 6]}
];
var GRADES = [
{"min": 85, "grade": "S", "title": "찐 츤데레", "desc": "좋아하는 마음을 표현하는 것보다 숨기는 게 훨씬 익숙한 편이에요. 퉁명스러운 말투 뒤에 진심이 숨어있다는 걸 아는 사람만 알아채는 스타일이에요. 상대가 조금만 더 눈치채 주면 좋을 텐데, 그래도 그 반전 매력이 은근히 사람을 끌어당겨요."},
{"min": 65, "grade": "A", "title": "고급 츤데레", "desc": "티는 잘 안 내지만 가까운 사람들은 이미 눈치채고 있을 확률이 높아요. 무심한 듯 챙기는 모습이 오히려 더 진심으로 느껴지는 타입이에요. 가끔은 솔직하게 말해도 매력이 줄지 않아요."},
{"min": 45, "grade": "B", "title": "라이트 츤데레", "desc": "필요할 땐 솔직하게 표현하고, 괜히 민망할 땐 살짝 츤츤거리는 균형 잡힌 스타일이에요. 상대 입장에서도 마음을 읽기 크게 어렵지 않은 편이라 관계가 편안하게 흘러가요."},
{"min": 25, "grade": "C", "title": "솔직 표현러", "desc": "감정을 숨기기보다 있는 그대로 표현하는 편이에요. 가끔은 너무 솔직해서 스스로 민망할 때도 있지만, 그만큼 상대가 마음을 편하게 느낄 수 있는 게 큰 장점이에요."},
{"min": 0, "grade": "D", "title": "직진 순정파", "desc": "좋아하면 좋아한다고, 서운하면 서운하다고 바로 말하는 직진 스타일이에요. 밀당보다는 진심으로 다가가는 쪽이 훨씬 편한 사람이에요. 꾸밈없는 그 솔직함이 오히려 가장 큰 매력이에요."}
];
var qi=0, score=0, maxScore=0, wrongs=[];
function show(id){ ['s1','s2','s3'].forEach(function(s){ document.getElementById(s).className=s===id?'':'hidden'; }); }
function startQuiz(){ qi=0; score=0; maxScore=0; wrongs=[]; show('s2'); renderQ(); }
function renderQ(){
  var q=QUESTIONS[qi], total=QUESTIONS.length;
  document.getElementById('progLabel').textContent=(qi+1)+' / '+total;
  document.getElementById('progScore').textContent=score+'점';
  document.getElementById('progFill').style.width=Math.round((qi+1)/total*100)+'%';
  document.getElementById('qNum').textContent='Q'+(qi+1);
  document.getElementById('qText').textContent=q.q;
  var opts=document.getElementById('opts');
  opts.innerHTML='';
  q.options.forEach(function(opt,i){
    var b=document.createElement('button');
    b.className='opt'; b.textContent=opt;
    b.onclick=function(){ pick(i); };
    opts.appendChild(b);
  });
}
function pick(i){
  var q=QUESTIONS[qi], btns=document.querySelectorAll('.opt');
  btns.forEach(function(b){ b.disabled=true; });
  var isAnswer=q.hasOwnProperty('answer');
  if(isAnswer){
    var correct=(i===q.answer);
    btns[i].className='opt '+(correct?'correct':'wrong');
    if(!correct) btns[q.answer].className='opt correct';
    if(correct){ score+=5; maxScore+=5; }
    else{ maxScore+=5; wrongs.push({q:q.q,a:q.options[q.answer]}); }
  } else {
    score+=q.scores[i];
    maxScore+=Math.max.apply(null,q.scores);
  }
  setTimeout(function(){ qi++; if(qi<QUESTIONS.length){ renderQ(); } else { showResult(); } }, isAnswer?700:0);
}
function showResult(){
  show('s3');
  var pct=Math.round(score/maxScore*100);
  var grade=GRADES[GRADES.length-1];
  for(var i=0;i<GRADES.length;i++){ if(pct>=GRADES[i].min){ grade=GRADES[i]; break; } }
  document.getElementById('resGrade').textContent=grade.grade+'등급';
  document.getElementById('resScore').innerHTML=score+'점 <span>/ '+maxScore+'점</span>';
  document.getElementById('resTitle').textContent=grade.title;
  document.getElementById('resDesc').textContent=grade.desc;
  document.getElementById('resMax').textContent=maxScore+'점';
  setTimeout(function(){ document.getElementById('resBar').style.width=pct+'%'; },200);
  if(wrongs.length>0){
    var wl=document.getElementById('wrongList');
    wl.innerHTML='<div class="wrong-title">⚡ 틀린 문제 다시보기 ('+wrongs.length+'개)</div>';
    wrongs.forEach(function(w){ wl.innerHTML+='<div class="wrong-item"><div class="wq">'+w.q+'</div><div class="wa">✓ 정답: '+w.a+'</div></div>'; });
  }
}
async function saveImg(){
  document.getElementById('mo').classList.add('on');
  document.getElementById('mw').innerHTML='이미지를 만들고 있어요...';
  try{
    if(document.fonts) await document.fonts.ready;
    var cv=await html2canvas(document.getElementById('cap'),{backgroundColor:'#FFFFFF',scale:2});
    var img=new Image(); img.src=cv.toDataURL('image/png');
    document.getElementById('mw').innerHTML='';
    document.getElementById('mw').appendChild(img);
    var p=document.createElement('p'); p.style.cssText='font-size:12px;color:#888;margin-top:8px;';
    p.textContent='이미지를 길게 눌러서 저장해주세요.';
    document.getElementById('mw').appendChild(p);
  }catch(e){ document.getElementById('mw').textContent='이미지 생성에 실패했어요.'; }
}
</script>
</body>
</html>
