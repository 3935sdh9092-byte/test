<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나는 어떤 웨딩 스타일이 어울릴까? 드림 웨딩 밸런스 테스트 — 테스트팩토리</title>
<meta name="description" content="언젠가 그려볼 나만의 드림 웨딩. 12가지 선택으로 알아보는 나의 웨딩 스타일 테스트.">
<meta property="og:title" content="나는 어떤 웨딩 스타일이 어울릴까? 드림 웨딩 밸런스 테스트 — 테스트팩토리">
<meta property="og:description" content="언젠가 그려볼 나만의 드림 웨딩. 12가지 선택으로 알아보는 나의 웨딩 스타일 테스트.">
<meta property="og:image" content="wedding-style-balance-thumb.png">
<meta property="og:image:width" content="900">
<meta property="og:image:height" content="1260">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4595078545343262" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#FFF7F5; --paper:#FFFFFF; --ink:#2B1F22; --sub:#8F7A80;
  --line:#F0DCE1; --acc:#C9748C; --gold:#C9986B; --chip:rgba(43,31,34,.06); --r:14px; --bw:2px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;min-height:100vh;}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 80px;}
.back{display:inline-block;margin-bottom:18px;font-size:13px;font-weight:700;color:var(--sub);text-decoration:none;}
.hero{text-align:center;padding:16px 0 24px;}
.hero .em{font-size:52px;line-height:1;margin-bottom:12px;}
.hero h1{font-size:22px;font-weight:900;margin-bottom:8px;letter-spacing:-.3px;word-break:keep-all;}
.hero p{font-size:14px;color:var(--sub);line-height:1.65;}
.start-btn{width:100%;padding:16px;border:0;border-radius:var(--r);background:var(--acc);color:#fff;
  font-family:inherit;font-size:16px;font-weight:900;cursor:pointer;margin-top:20px;}
.prog-wrap{margin-bottom:20px;}
.prog-info{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:8px;color:var(--sub);}
.prog-track{height:8px;background:var(--chip);border-radius:999px;overflow:hidden;border:var(--bw) solid var(--line);}
.prog-fill{height:100%;background:var(--acc);border-radius:999px;transition:width .25s ease;}
.qcard{background:var(--paper);border:var(--bw) solid var(--line);border-radius:var(--r);padding:22px 18px;}
.qnum{display:inline-block;padding:4px 10px;background:var(--acc);color:#fff;border-radius:999px;
  font-size:11px;font-weight:800;margin-bottom:14px;}
.qtext{font-size:18px;font-weight:800;line-height:1.5;margin-bottom:18px;word-break:keep-all;}
.opts{display:grid;gap:10px;}
.opt{width:100%;padding:13px 15px;border:var(--bw) solid var(--line);border-radius:10px;
  background:#fff;font-family:inherit;font-size:14px;font-weight:600;text-align:left;cursor:pointer;
  color:var(--ink);transition:all .15s ease;word-break:keep-all;}
.opt:hover{background:var(--chip);border-color:var(--acc);}
.opt:disabled{cursor:default;}
.opt.pk{background:var(--chip);border-color:var(--acc);}
#cap{background:var(--paper);border:var(--bw) solid var(--line);border-radius:var(--r);padding:24px 18px;margin-bottom:16px;}
.res-header{text-align:center;padding:6px 0 16px;border-bottom:var(--bw) solid var(--line);margin-bottom:16px;}
.res-em{font-size:56px;line-height:1;margin-bottom:10px;}
.res-badge{display:inline-block;padding:6px 16px;background:var(--acc);color:#fff;border-radius:999px;
  font-size:12.5px;font-weight:900;margin-bottom:12px;}
.res-title{font-size:23px;font-weight:900;margin-bottom:6px;word-break:keep-all;}
.res-tag{font-size:13.5px;color:var(--gold);font-weight:800;margin-bottom:2px;word-break:keep-all;}
.res-desc{font-size:14.5px;line-height:1.8;color:var(--ink);text-align:left;margin-top:14px;}
.traits{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;}
.trait{padding:6px 12px;background:var(--chip);border-radius:999px;font-size:12px;font-weight:700;color:var(--acc);}
.dist-wrap{margin-top:20px;}
.dist-title{font-size:12.5px;font-weight:800;color:var(--sub);margin-bottom:10px;}
.dist-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.dist-row .lab{width:96px;font-size:12px;font-weight:800;flex-shrink:0;}
.dist-row .track{flex:1;height:10px;background:var(--chip);border-radius:999px;overflow:hidden;}
.dist-row .fill{height:100%;background:var(--acc);border-radius:999px;transition:width .5s ease;}
.dist-row.me .fill{background:var(--gold);}
.dist-row .num{width:20px;text-align:right;font-size:11.5px;font-weight:800;color:var(--sub);}
.footer-note{font-size:11px;color:var(--sub);text-align:center;margin-top:18px;}
.stk{display:grid;gap:10px;}
.btn{width:100%;padding:14px;border:var(--bw) solid var(--ink);border-radius:var(--r);background:#fff;
  font-family:inherit;font-weight:800;font-size:14.5px;cursor:pointer;color:var(--ink);}
.btn.fill{background:var(--ink);color:#fff;border-color:var(--ink);}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:20px;}
.mo.on{display:flex;}
.mb{background:#fff;border-radius:16px;padding:20px;max-width:340px;width:100%;text-align:center;}
.mb img{width:100%;border-radius:10px;margin-bottom:12px;}
.mb .cl{width:100%;padding:12px;border:0;border-radius:10px;background:var(--chip);font-family:inherit;font-weight:800;cursor:pointer;color:var(--ink);}
.hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 목록으로</a>
  <div id="s1">
    <div class="hero">
      <div class="em">💐</div>
      <h1>나는 어떤 웨딩 스타일이 어울릴까? 드림 웨딩 밸런스 테스트</h1>
      <p>언젠가 그려볼 나만의 드림 웨딩. 12가지 선택으로 알아보는 나의 웨딩 스타일 — 재미로 상상해보는 테스트예요.</p>
      <button class="start-btn" onclick="startQuiz()">테스트 시작하기</button>
    </div>
  </div>
  <div id="s2" class="hidden">
    <div class="prog-wrap">
      <div class="prog-info"><span id="progLabel">1 / 12</span><span id="progPos"></span></div>
      <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    </div>
    <div class="qcard">
      <div class="qnum" id="qNum">Q1</div>
      <div class="qtext" id="qText"></div>
      <div class="opts" id="opts"></div>
    </div>
  </div>
  <div id="s3" class="hidden">
    <div id="cap">
      <div class="res-header">
        <div class="res-em" id="resEm"></div>
        <div class="res-badge" id="resBadge"></div>
        <div class="res-title" id="resTitle"></div>
        <div class="res-tag" id="resTag"></div>
      </div>
      <div class="res-desc" id="resDesc"></div>
      <div class="traits" id="resTraits"></div>
      <div class="dist-wrap">
        <div class="dist-title">📊 나의 웨딩 스타일 분포</div>
        <div id="distBox"></div>
      </div>
      <div class="footer-note">POWERED BY 테스트팩토리 · 재미로 봐주세요.</div>
    </div>
    <div class="stk">
      <button class="btn fill" onclick="saveImg()">결과 이미지 저장하기</button>
      <button class="btn" onclick="location.reload()">다시 풀기</button>
      <button class="btn" onclick="location.href='index.html'">다른 테스트 보기</button>
    </div>
  </div>
</div>
<div class="mo" id="mo">
  <div class="mb">
    <div id="mw">이미지를 만들고 있어요...</div>
    <button class="cl" onclick="document.getElementById('mo').classList.remove('on')">닫기</button>
  </div>
</div>
<script>
var POS = ["스몰&아늑 웨딩러","클래식&로맨틱 웨딩러","야외&가든 웨딩러","시크&모던 웨딩러","유니크&개성만점 웨딩러"];
var QUESTIONS = [{"q":"드림 웨딩 장소를 고른다면?","options":["소규모 프라이빗 하우스","유서 깊은 성당이나 클래식한 홀","햇살 가득한 가든이나 정원","미니멀한 감성의 스튜디오·루프탑","이색적인 장소 (미술관, 온실 등)"]},{"q":"웨딩드레스 스타일은?","options":["편안하고 심플한 슬립 드레스","우아한 레이스 볼륨 드레스","가벼운 소재의 플로럴 드레스","매끈한 미니멀 실루엣 드레스","개성 있는 컬러·디자인 드레스"]},{"q":"청첩장 스타일은?","options":["소수에게만 직접 전하는 손편지 느낌","클래식한 캘리그래피 청첩장","프레스 플라워를 곁들인 청첩장","미니멀한 모던 타이포 청첩장","팝아트풍 개성있는 청첩장"]},{"q":"부케로 고르고 싶은 꽃은?","options":["작은 들꽃 부케","풍성한 장미 부케","자연스러운 그린&와일드 부케","화이트&그린 미니멀 부케","컬러풀한 이색 꽃 부케"]},{"q":"웨딩 케이터링 스타일은?","options":["가까운 사람들과 즐기는 홈메이드 다이닝","격식있는 정통 코스요리","야외 피크닉·뷔페 스타일","세련된 파인다이닝 핑거푸드","각국 요리를 섞은 퓨전 다이닝"]},{"q":"웨딩 음악은?","options":["잔잔한 어쿠스틱 라이브","클래식 현악 연주","자연 속 어울리는 포크·컨트리","세련된 재즈·로파이","취향 저격 인디·실험적인 플레이리스트"]},{"q":"혼자 상상할 때 가장 설레는 장면은?","options":["가까운 사람들과 도란도란 이야기 나누는 모습","웅장한 아치 아래 입장하는 순간","자연광 아래 활짝 웃고 있는 사진","심플하지만 세련된 공간에서의 스냅","나만의 컨셉이 가득한 파티 같은 장면"]},{"q":"축가·이벤트로 하고 싶은 것은?","options":["편지 낭독처럼 진솔한 순서","정통 축가 무대","야외에서 즐기는 게임이나 액티비티","심플한 영상 메시지","깜짝 퍼포먼스나 이색 이벤트"]},{"q":"신혼여행 스타일은?","options":["조용한 소도시에서 힐링","유럽의 클래식한 도시 여행","자연 속 리조트나 캠핑","감각적인 도시의 호텔 스테이 여행","평소 안 가본 이색적인 나라"]},{"q":"하객들에게 주고 싶은 답례품은?","options":["손글씨 카드가 담긴 작은 선물","클래식한 디저트 세트","미니 화분이나 씨앗 키트","감각적인 디자인 소품","개성있는 커스텀 굿즈"]},{"q":"웨딩 컬러 팔레트는?","options":["화이트&베이지의 잔잔한 톤","아이보리&골드의 클래식 톤","그린&어스톤의 자연스러운 톤","블랙&화이트의 모던 톤","비비드 컬러의 개성있는 톤"]},{"q":"나를 한마디로 표현하면?","options":["작고 소중한 걸 좋아하는 사람","클래식하고 우아한 걸 좋아하는 사람","자연스러움을 사랑하는 사람","심플하고 세련된 걸 좋아하는 사람","남들과 다른 걸 좋아하는 사람"]}];
var RESULTS = [{"name":"스몰&아늑 웨딩러","emoji":"🕯️","tagline":"가까운 사람들과 나누는 진심 어린 순간","color":"#C08552","desc":"화려함보다 진심이 느껴지는 순간을 더 소중하게 생각하는 편이에요. 가까운 사람들과 편안하게 마음을 나누는 자리를 만드는 데서 가장 큰 행복을 느껴요. 작지만 알찬, 나만의 속도로 채워가는 걸 좋아하는 타입이에요.","traits":["아늑한 무드","진심 중시","편안한 분위기","소소한 행복"]},{"name":"클래식&로맨틱 웨딩러","emoji":"👰","tagline":"우아하고 낭만적인 순간을 꿈꾸는","color":"#A8617D","desc":"시간이 지나도 변하지 않는 우아함과 낭만을 좋아하는 편이에요. 격식 있는 아름다움 속에서 특별한 순간을 만끽하는 걸 즐기고, 클래식한 디테일 하나하나에 정성을 쏟는 타입이에요.","traits":["우아한 감성","로맨틱 무드","디테일 중시","격조 있는 취향"]},{"name":"야외&가든 웨딩러","emoji":"🌿","tagline":"자연 속에서 자유롭게 빛나는","color":"#6E9B6A","desc":"자연스럽고 편안한 분위기를 좋아하는 편이에요. 탁 트인 공간에서 햇살과 바람을 느끼며 즐기는 걸 좋아하고, 꾸미지 않아도 빛나는 자연스러운 아름다움에 끌려요.","traits":["자연친화적","자유로운 감성","편안한 매력","꾸밈없는 아름다움"]},{"name":"시크&모던 웨딩러","emoji":"🖤","tagline":"군더더기 없이 세련된 취향","color":"#4A4550","desc":"불필요한 장식 없이 깔끔하고 세련된 걸 좋아하는 편이에요. 미니멀한 공간과 심플한 디자인 속에서 오히려 더 큰 임팩트를 만들어내는 감각이 있어요.","traits":["미니멀 감성","세련된 취향","깔끔한 안목","도시적인 매력"]},{"name":"유니크&개성만점 웨딩러","emoji":"🎨","tagline":"나만의 컬러가 확실한","color":"#E0824A","desc":"정해진 틀보다 나만의 스타일을 만들어가는 걸 좋아하는 편이에요. 남들과는 다른 이색적인 아이디어로 특별한 순간을 연출하는 데 재능이 있고, 그 개성 자체가 큰 매력이에요.","traits":["독창적인 감각","개성 넘치는 취향","이색적인 아이디어","확실한 자기 취향"]}];

var qi=0, counts=[0,0,0,0,0];
function show(id){ ['s1','s2','s3'].forEach(function(s){ document.getElementById(s).className=s===id?'':'hidden'; }); }
function startQuiz(){ qi=0; counts=[0,0,0,0,0]; show('s2'); renderQ(); }
function renderQ(){
  var q=QUESTIONS[qi], total=QUESTIONS.length;
  document.getElementById('progLabel').textContent=(qi+1)+' / '+total;
  document.getElementById('progFill').style.width=Math.round((qi)/total*100)+'%';
  document.getElementById('qNum').textContent='Q'+(qi+1);
  document.getElementById('qText').textContent=q.q;
  var opts=document.getElementById('opts');
  opts.innerHTML='';
  q.options.forEach(function(opt,i){
    var b=document.createElement('button');
    b.className='opt'; b.textContent=opt;
    b.onclick=function(){ pick(i); };
    opts.appendChild(b);
  });
}
function pick(i){
  var btns=document.querySelectorAll('.opt');
  btns.forEach(function(b){ b.disabled=true; });
  btns[i].className='opt pk';
  counts[i]++;
  setTimeout(function(){ qi++; if(qi<QUESTIONS.length){ renderQ(); } else { showResult(); } }, 260);
}
function showResult(){
  show('s3');
  var best=0;
  for(var i=1;i<counts.length;i++){ if(counts[i]>counts[best]) best=i; }
  var r=RESULTS[best];
  document.getElementById('resEm').textContent=r.emoji;
  document.getElementById('resBadge').textContent=POS[best];
  document.getElementById('resBadge').style.background=r.color;
  document.getElementById('resTitle').textContent=r.name;
  document.getElementById('resTag').textContent=r.tagline;
  document.getElementById('resTag').style.color=r.color;
  document.getElementById('resDesc').textContent=r.desc;
  document.getElementById('resTraits').innerHTML=r.traits.map(function(t){return '<span class="trait">#'+t+'</span>';}).join('');
  var total=QUESTIONS.length;
  var distHtml='';
  POS.forEach(function(p,i){
    var pct=Math.round(counts[i]/total*100);
    distHtml+='<div class="dist-row'+(i===best?' me':'')+'"><div class="lab">'+p+'</div>'+
      '<div class="track"><div class="fill" style="width:'+pct+'%"></div></div>'+
      '<div class="num">'+counts[i]+'</div></div>';
  });
  document.getElementById('distBox').innerHTML=distHtml;
}
async function saveImg(){
  document.getElementById('mo').classList.add('on');
  document.getElementById('mw').innerHTML='이미지를 만들고 있어요...';
  try{
    if(document.fonts) await document.fonts.ready;
    var cv=await html2canvas(document.getElementById('cap'),{backgroundColor:'#FFFFFF',scale:2});
    var img=new Image(); img.src=cv.toDataURL('image/png');
    document.getElementById('mw').innerHTML='';
    document.getElementById('mw').appendChild(img);
    var p=document.createElement('p'); p.style.cssText='font-size:12px;color:#888;margin-top:8px;';
    p.textContent='이미지를 길게 눌러서 저장해주세요.';
    document.getElementById('mw').appendChild(p);
  }catch(e){ document.getElementById('mw').textContent='이미지 생성에 실패했어요.'; }
}

</script>
</body>
</html>
