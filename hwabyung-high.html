<html lang="ko">
<head>
<meta charset="UTF-8">

<style>
:root{--bg:#F8FAFD;--paper:#FFFFFF;--ink:#1C1917;--sub:#64748B;
  --line:#BFDBFE;--acc:#1E3A8A;--chip:rgba(0,0,0,.045);--r:16px;--bw:1.5px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;min-height:100vh;}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 80px;}
.back{display:inline-block;margin-bottom:18px;font-size:13px;font-weight:700;color:var(--sub);text-decoration:none;}
.hero{text-align:center;padding:12px 0 20px;}
.hero .em{font-size:46px;line-height:1;margin-bottom:12px;}
.hero h1{font-size:23px;font-weight:900;margin-bottom:10px;letter-spacing:-.3px;}
.hero p{font-size:14px;color:var(--sub);line-height:1.75;}
.notice-card{margin:0 0 18px;padding:14px 16px;background:var(--paper);border:var(--bw) solid var(--line);
  border-radius:var(--r);font-size:13px;color:var(--sub);line-height:1.75;}
.notice-card b{color:var(--ink);}
.start-btn{width:100%;padding:16px;border:0;border-radius:var(--r);background:var(--acc);color:#fff;
  font-family:inherit;font-size:16px;font-weight:900;cursor:pointer;}
.prog-wrap{margin-bottom:18px;}
.prog-info{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:7px;color:var(--sub);}
.prog-track{height:6px;background:var(--chip);border-radius:999px;overflow:hidden;}
.prog-fill{height:100%;background:var(--acc);border-radius:999px;transition:width .3s;opacity:.8;}
.qcard{background:var(--paper);border:var(--bw) solid var(--line);border-radius:var(--r);padding:22px 18px;}
.qnum{display:inline-block;padding:3px 10px;background:var(--acc);color:#fff;border-radius:999px;
  font-size:11px;font-weight:800;margin-bottom:14px;opacity:.9;}
.qtext{font-size:16.5px;font-weight:700;line-height:1.6;margin-bottom:18px;word-break:keep-all;}
.opts{display:grid;gap:8px;}
.opt{width:100%;padding:13px 16px;border:var(--bw) solid var(--line);border-radius:12px;
  background:var(--paper);font-family:inherit;font-size:14px;font-weight:600;text-align:left;cursor:pointer;
  color:var(--ink);transition:all .12s;word-break:keep-all;}
.opt:hover{background:var(--chip);border-color:var(--acc);}
.opt.sel{background:var(--acc);color:#fff;border-color:var(--acc);}
.opt:disabled{cursor:default;}
#cap{background:var(--paper);border:var(--bw) solid var(--line);border-radius:var(--r);padding:24px 20px;margin-bottom:16px;}
.res-badge{display:inline-block;padding:5px 14px;border-radius:999px;font-size:12px;font-weight:900;color:#fff;margin-bottom:14px;}
.res-score-wrap{display:flex;align-items:flex-end;gap:6px;margin-bottom:6px;}
.res-score{font-size:48px;font-weight:900;line-height:1;}
.res-score-max{font-size:16px;color:var(--sub);margin-bottom:6px;}
.res-title{font-size:20px;font-weight:900;margin-bottom:14px;}
.gauge-wrap{margin:14px 0 18px;}
.gauge-bg{height:14px;background:var(--chip);border-radius:999px;overflow:hidden;border:var(--bw) solid var(--line);}
.gauge-fill{height:100%;border-radius:999px;transition:width .7s ease;}
.gauge-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:5px;font-weight:600;}
.res-msg{font-size:14.5px;line-height:1.85;color:var(--ink);margin-bottom:20px;word-break:keep-all;
  padding:16px;background:var(--chip);border-radius:12px;}
.sol-title{font-size:13px;font-weight:900;color:var(--sub);margin-bottom:10px;}
.sol-list{display:grid;gap:8px;}
.sol-item{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;
  background:var(--paper);border:var(--bw) solid var(--line);border-radius:10px;font-size:13.5px;line-height:1.65;}
.sol-dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex-shrink:0;margin-top:7px;opacity:.8;}
.hospital-note{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:12.5px;line-height:1.75;}
.zone-row{display:flex;gap:4px;margin:16px 0 4px;align-items:center;flex-wrap:wrap;}
.zone-chip{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;color:#fff;}
.footer-note{font-size:11px;color:var(--sub);text-align:center;margin-top:18px;line-height:1.75;}
.stk{display:grid;gap:10px;}
.btn{width:100%;padding:14px;border:var(--bw) solid var(--ink);border-radius:var(--r);
  background:var(--paper);font-family:inherit;font-weight:800;font-size:14.5px;cursor:pointer;color:var(--ink);}
.btn.fill{background:var(--acc);color:#fff;border-color:var(--acc);}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;
  align-items:center;justify-content:center;padding:20px;}
.mo.on{display:flex;}
.mb{background:#fff;border-radius:16px;padding:20px;max-width:340px;width:100%;text-align:center;}
.mb img{width:100%;border-radius:10px;margin-bottom:12px;}
.mb .cl{width:100%;padding:12px;border:0;border-radius:10px;background:var(--chip);
  font-family:inherit;font-weight:800;cursor:pointer;font-size:14px;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 목록으로</a>
  <div id="s1">
    <div class="hero">
      <div class="em">📖</div>
      <h1>고등학생 화병 자가진단</h1>
      <p>공부, 성적, 관계, 진로...<br>이것저것 쌓인 것들, 지금 얼마나 힘든지 확인해봐요.</p>
    </div>
    <div class="notice-card">
      💛 이 테스트는 <b>의학적 진단이 아닌 참고용</b>이에요.<br>
      점수가 높게 나왔다면, 그건 당신이 <b>약한 게 아니라 오래 많이 버텨왔다는 신호</b>예요.
    </div>
    <button class="start-btn" onclick="startQuiz()">자가진단 시작하기</button>

  <div id="s2" class="hidden">

    <div class="qcard">
      <div class="qnum" id="qNum">Q1</div>
      <div class="qtext" id="qText"></div>
      <div class="opts" id="opts"></div>
    </div>
  </div>
  <div id="s3" class="hidden">
    <div id="cap">
      <div class="res-badge" id="resBadge"></div>
      <div class="res-score-wrap">
        <div class="res-score" id="resScore"></div>
        <div class="res-score-max">/ 54점</div>

      <div class="res-title" id="resTitle"></div>
      <div class="gauge-wrap">

      </div>
      <div class="zone-row" id="zoneRow"></div>
      <div class="res-msg" id="resMsg"></div>
      <div class="sol-title">💡 지금 나에게 도움이 될 수 있는 것들</div>
      <div class="sol-list" id="solList"></div>
      <div class="hospital-note" id="hospitalNote"></div>
      <div class="footer-note">이 결과는 의학적 진단이 아닌 참고용이에요.<br>화병은 성격 문제가 아니에요. 오래 버텨온 당신, 충분히 수고했어요. 🌿</div>
    </div>
    <div class="stk">
      <button class="btn fill" onclick="saveImg()">결과 저장하기</button>
      <button class="btn" onclick="location.reload()">다시 해보기</button>
      <button class="btn" onclick="location.href='index.html'">다른 테스트 보기</button>
    </div>
  </div>
</div>
<div class="mo" id="mo">
  <div class="mb">
    <div id="mw">이미지를 만들고 있어요...</div>
    <button class="cl" onclick="document.getElementById('mo').classList.remove('on')">닫기</button>
  </div>
</div>

  {min:0,color:'#1D4ED8',label:'안정'},
];
function show(id){['s1','s2','s3'].forEach(function(s){document.getElementById(s).className=s===id?'':'hidden';});}
function startQuiz(){qi=0;score=0;show('s2');renderQ();}
function renderQ(){
  var q=QUESTIONS[qi],total=QUESTIONS.length;
  document.getElementById('progLabel').textContent=(qi+1)+' / '+total;
  document.getElementById('progQ').textContent='Q'+(qi+1);
  document.getElementById('progFill').style.width=Math.round((qi+1)/total*100)+'%';
  document.getElementById('qNum').textContent='Q'+(qi+1);
  document.getElementById('qText').textContent=q.q;
  var opts=document.getElementById('opts');opts.innerHTML='';
  q.options.forEach(function(opt,i){
    var b=document.createElement('button');b.className='opt';b.textContent=opt;
    b.onclick=function(){pick(i);};opts.appendChild(b);
  });
}
function pick(i){
  var q=QUESTIONS[qi],btns=document.querySelectorAll('.opt');
  btns.forEach(function(b){b.disabled=true;});
  btns[i].className='opt sel';
  score+=q.scores[i];
  setTimeout(function(){qi++;if(qi<QUESTIONS.length){renderQ();}else{showResult();}},350);
}
function showResult(){
  show('s3');
  var pct=Math.round(score/MAX_SCORE*100);
  var grade=GRADES[GRADES.length-1];
  for(var i=0;i<GRADES.length;i++){if(pct>=GRADES[i].min){grade=GRADES[i];break;}}
  document.getElementById('resBadge').textContent=grade.grade+' 단계';
  document.getElementById('resBadge').style.background=grade.color;
  document.getElementById('resScore').textContent=score+'점';
  document.getElementById('resScore').style.color=grade.color;
  document.getElementById('resTitle').textContent=grade.title;
  document.getElementById('gaugeFill').style.background=grade.color;
  setTimeout(function(){document.getElementById('gaugeFill').style.width=pct+'%';},200);
  var zr=document.getElementById('zoneRow');
  ZONE_COLORS.slice().reverse().forEach(function(z){
    var chip=document.createElement('span');chip.className='zone-chip';
    chip.style.background=z.color;chip.style.opacity=(z.color===grade.color)?'1':'0.3';
    chip.textContent=z.label;zr.appendChild(chip);
    if(z.color===grade.color){
      var arr=document.createElement('span');arr.className='zone-arrow';
      arr.textContent='◀ 지금 여기';
      arr.style.cssText='color:'+grade.color+';font-weight:900;font-size:11px;margin-left:4px;';
      zr.appendChild(arr);
    }
  });
  document.getElementById('resMsg').textContent=grade.msg;
  var sl=document.getElementById('solList');
  grade.solutions.forEach(function(sol){
    var item=document.createElement('div');item.className='sol-item';
    item.innerHTML='<div class="sol-dot"></div><span>'+sol+'</span>';sl.appendChild(item);
  });
  var hn=document.getElementById('hospitalNote');
  if(grade.hospital){
    hn.innerHTML='🏥 <b>정신건강 위기상담 전화: 1577-0199</b> (24시간 무료)<br>혼자 해결하려 하지 않아도 돼요. 도움을 구하는 것은 용기 있는 행동이에요.';
    hn.style.cssText='margin-top:14px;padding:12px 14px;border-radius:10px;font-size:12.5px;line-height:1.75;background:#FEF2F2;border:1.5px solid #FECACA;color:#991B1B;';
  }else{
    hn.innerHTML='💬 증상이 2주 이상 이어지거나 일상이 힘들다면, 가까운 정신건강의학과 또는 한의원 방문을 고려해보세요.';
    hn.style.cssText='margin-top:14px;padding:12px 14px;border-radius:10px;font-size:12.5px;line-height:1.75;background:var(--chip);color:var(--sub);';
  }
}
async function saveImg(){
  document.getElementById('mo').classList.add('on');
  document.getElementById('mw').innerHTML='이미지를 만들고 있어요...';
  try{
    if(document.fonts)await document.fonts.ready;
    var cv=await html2canvas(document.getElementById('cap'),{backgroundColor:'#FFFFFF',scale:2});
    var img=new Image();img.src=cv.toDataURL('image/png');
    document.getElementById('mw').innerHTML='';document.getElementById('mw').appendChild(img);
    var p=document.createElement('p');p.style.cssText='font-size:12px;color:#888;margin-top:8px;';
    p.textContent='이미지를 길게 눌러서 저장해주세요.';document.getElementById('mw').appendChild(p);
  }catch(e){document.getElementById('mw').textContent='이미지 생성에 실패했어요.';}
}
</script>
