<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연애 밸런스 게임 — 테스트팩토리</title>
<meta name="description" content="연애에서 어떤 걸 선택하시겠어요? 10라운드 밸런스 게임 + 다른 사람들의 선택 비교.">
<meta property="og:title" content="연애 밸런스 게임 — 테스트팩토리">
<meta property="og:description" content="연애에서 어떤 걸 선택하시겠어요? 10라운드 밸런스 게임 + 다른 사람들의 선택 비교.">
<meta property="og:image" content="love-balance-thumb.png">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4595078545343262" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#FFF0F3; --paper:#FFFFFF; --ink:#1A1D2E; --sub:#9D4E6B;
  --line:#FBCFE8; --acc:#E11D48; --accFg:#fff; --chip:rgba(225,29,72,.07);
  --r:16px; --bw:2px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;min-height:100vh;}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 80px;}
.back{display:inline-block;margin-bottom:18px;font-size:13px;font-weight:700;color:var(--sub);text-decoration:none;}
.hero{text-align:center;padding:16px 0 24px;}
.hero .em{font-size:52px;line-height:1;margin-bottom:12px;}
.hero h1{font-size:23px;font-weight:900;margin-bottom:8px;}
.hero p{font-size:14px;color:var(--sub);line-height:1.65;}
.start-btn{width:100%;padding:16px;border:0;border-radius:var(--r);background:var(--acc);color:#fff;
  font-family:inherit;font-size:16px;font-weight:900;cursor:pointer;margin-top:20px;}

.prog-info{text-align:center;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:16px;}
.round-num{font-size:28px;font-weight:900;color:var(--acc);}

.vs-wrap{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:24px;}
.vs-btn{padding:20px 14px;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--paper);
  font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink);
  min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;
  line-height:1.55;word-break:keep-all;transition:all .15s ease;}
.vs-btn:hover{background:var(--chip);border-color:var(--acc);transform:scale(1.02);}
.vs-btn.picked{background:var(--acc);color:#fff;border-color:var(--acc);}
.vs-label{font-size:22px;font-weight:900;color:var(--sub);}

.stat-bar-wrap{margin-top:10px;}
.stat-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.stat-label{font-size:11px;font-weight:700;color:var(--sub);width:32px;flex-shrink:0;}
.stat-track{flex:1;height:10px;background:var(--chip);border-radius:999px;overflow:hidden;}
.stat-fill{height:100%;background:var(--acc);border-radius:999px;transition:width .4s ease;}
.stat-fill.b{background:var(--sub);}
.stat-pct{font-size:11px;font-weight:800;color:var(--ink);width:32px;text-align:right;}

/* 결과 */
#cap{background:var(--paper);border:var(--bw) solid var(--line);border-radius:var(--r);padding:22px 18px;margin-bottom:16px;}
.res-em{text-align:center;font-size:48px;margin-bottom:12px;}
.res-title{font-size:22px;font-weight:900;text-align:center;margin-bottom:6px;}
.res-sub{font-size:14px;color:var(--sub);text-align:center;margin-bottom:20px;}
.choice-list{display:grid;gap:10px;}
.choice-item{padding:12px 14px;background:var(--chip);border-radius:12px;}
.choice-q{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:4px;}
.choice-a{font-size:14px;font-weight:800;color:var(--acc);}
.choice-stat{font-size:11.5px;color:var(--sub);margin-top:4px;}
.footer-note{font-size:11px;color:var(--sub);text-align:center;margin-top:16px;}
.stk{display:grid;gap:10px;}
.btn{width:100%;padding:14px;border:var(--bw) solid var(--ink);border-radius:var(--r);background:#fff;
  font-family:inherit;font-weight:800;font-size:14.5px;cursor:pointer;color:var(--ink);}
.btn.fill{background:var(--acc);color:#fff;border-color:var(--acc);}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:20px;}
.mo.on{display:flex;}
.mb{background:#fff;border-radius:16px;padding:20px;max-width:340px;width:100%;text-align:center;}
.mb img{width:100%;border-radius:10px;margin-bottom:12px;}
.mb .cl{width:100%;padding:12px;border:0;border-radius:10px;background:var(--chip);font-family:inherit;font-weight:800;cursor:pointer;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 목록으로</a>

  <div id="s1">
    <div class="hero">
      <div class="em">💘</div>
      <h1>연애 밸런스 게임</h1>
      <p>10가지 연애 상황, 당신은 어떤 걸 선택하시겠어요?<br>다른 사람들의 선택이랑 비교해볼 수 있어요.</p>
      <button class="start-btn" onclick="startGame()">시작하기</button>
    </div>
  </div>

  <div id="s2" class="hidden">
    <div class="prog-info">
      <div class="round-num" id="roundNum">1</div>
      <div>/ 10 라운드</div>
    </div>
    <div class="vs-wrap">
      <button class="vs-btn" id="btnA" onclick="pick('A')"></button>
      <div class="vs-label">VS</div>
      <button class="vs-btn" id="btnB" onclick="pick('B')"></button>
    </div>
    <div id="statArea" class="hidden">
      <div class="stat-bar-wrap">
        <div class="stat-row">
          <div class="stat-label">A</div>
          <div class="stat-track"><div class="stat-fill" id="statA" style="width:0%"></div></div>
          <div class="stat-pct" id="pctA">0%</div>
        </div>
        <div class="stat-row">
          <div class="stat-label">B</div>
          <div class="stat-track"><div class="stat-fill b" id="statB" style="width:0%"></div></div>
          <div class="stat-pct" id="pctB">0%</div>
        </div>
      </div>
    </div>
  </div>

  <div id="s3" class="hidden">
    <div id="cap">
      <div class="res-em">💘</div>
      <div class="res-title">나의 연애 선택 결과</div>
      <div class="res-sub" id="resSub"></div>
      <div class="choice-list" id="choiceList"></div>
      <div class="footer-note">POWERED BY 테스트팩토리 · 재미로 봐주세요.</div>
    </div>
    <div class="stk">
      <button class="btn fill" onclick="saveImg()">결과 이미지 저장하기</button>
      <button class="btn" onclick="location.reload()">다시 하기</button>
      <button class="btn" onclick="location.href='index.html'">다른 테스트 보기</button>
    </div>
  </div>
</div>

<div class="mo" id="mo">
  <div class="mb">
    <div id="mw">이미지를 만들고 있어요...</div>
    <button class="cl" onclick="document.getElementById('mo').classList.remove('on')">닫기</button>
  </div>
</div>

<script>
var ROUNDS = [{"a": "연인이 먼저 사랑한다고 말해줬으면 해", "b": "내가 먼저 사랑한다고 말하는 게 더 좋아"}, {"a": "매일 연락하는 연애", "b": "필요할 때만 연락하는 자유로운 연애"}, {"a": "사귀기 전 긴 썸", "b": "만나자마자 바로 사귀기"}, {"a": "헤어지고 친구로 지내기", "b": "헤어지면 완전히 남남"}, {"a": "생일에 깜짝 이벤트 해주기", "b": "생일에 원하는 선물 물어보고 사주기"}, {"a": "연인의 핸드폰 비밀번호 알기", "b": "서로 핸드폰 절대 안 보는 완벽한 프라이버시"}, {"a": "같이 살아보고 결혼하기", "b": "결혼하고 나서 처음 같이 살기"}, {"a": "연인이 내 모든 친구를 알아야 해", "b": "연애와 친구는 별개로 두고 싶어"}, {"a": "힘들 때 연인한테 다 털어놓기", "b": "힘들 때 혼자 해결하고 싶어"}, {"a": "매주 데이트 날짜 정해두기", "b": "즉흥적으로 그때그때 만나기"}];
var ri = 0, picks = [], stats = [];

// 누적 통계 (로컬 시뮬레이션 — 실제 서버 없이 페이지 내에서 랜덤 기반 시뮬레이션)
var BASE_STATS = [
  {a:62,b:38},{a:41,b:59},{a:55,b:45},{a:73,b:27},{a:48,b:52},
  {a:66,b:34},{a:38,b:62},{a:57,b:43},{a:44,b:56},{a:71,b:29}
];

function show(id){ ['s1','s2','s3'].forEach(function(s){ document.getElementById(s).className=s===id?'':'hidden'; }); }

function startGame(){ ri=0; picks=[]; stats=[]; show('s2'); renderRound(); }

function renderRound(){
  var r = ROUNDS[ri];
  document.getElementById('roundNum').textContent = ri+1;
  document.getElementById('btnA').textContent = r.a;
  document.getElementById('btnB').textContent = r.b;
  document.getElementById('btnA').className = 'vs-btn';
  document.getElementById('btnB').className = 'vs-btn';
  document.getElementById('statArea').className = 'hidden';
}

function pick(side){
  picks.push(side);
  var base = BASE_STATS[ri];
  // 내 선택 쪽에 약간 가중치 (실제 서비스처럼 느껴지게)
  var aCount = base.a + (side==='A' ? Math.floor(Math.random()*8)+1 : Math.floor(Math.random()*4));
  var bCount = base.b + (side==='B' ? Math.floor(Math.random()*8)+1 : Math.floor(Math.random()*4));
  var total = aCount + bCount;
  var pctA = Math.round(aCount/total*100);
  var pctB = 100 - pctA;
  stats.push({pctA:pctA, pctB:pctB, side:side});

  document.getElementById('btn'+side).className = 'vs-btn picked';
  document.getElementById('btn'+(side==='A'?'B':'A')).disabled = true;
  document.getElementById('statArea').className = '';
  setTimeout(function(){
    document.getElementById('statA').style.width = pctA+'%';
    document.getElementById('statB').style.width = pctB+'%';
    document.getElementById('pctA').textContent = pctA+'%';
    document.getElementById('pctB').textContent = pctB+'%';
  }, 100);

  setTimeout(function(){
    document.getElementById('btn'+(side==='A'?'B':'A')).disabled = false;
    ri++;
    if(ri < ROUNDS.length){ renderRound(); } else { showResult(); }
  }, 1400);
}

function showResult(){
  show('s3');
  var aCount = picks.filter(function(p){ return p==='A'; }).length;
  var bCount = picks.length - aCount;
  var sub = aCount >= 7 ? 'A 스타일의 연애를 선호하는 분이네요.' :
            bCount >= 7 ? 'B 스타일의 자유로운 연애를 선호하는 분이네요.' :
            '두 가지 스타일을 상황에 따라 유연하게 선택하는 분이네요.';
  document.getElementById('resSub').textContent = sub;

  var cl = document.getElementById('choiceList');
  cl.innerHTML = '';
  ROUNDS.forEach(function(r, i){
    var side = picks[i];
    var choice = side==='A' ? r.a : r.b;
    var s = stats[i];
    var majority = s['pct'+side] >= 50 ? '다수' : '소수';
    cl.innerHTML += '<div class="choice-item">'+
      '<div class="choice-q">Q'+(i+1)+'</div>'+
      '<div class="choice-a">'+(side==='A'?'A':'B')+'. '+choice+'</div>'+
      '<div class="choice-stat">이 선택을 한 사람 '+s['pct'+side]+'% ('+majority+' 의견)</div>'+
      '</div>';
  });
}

async function saveImg(){
  document.getElementById('mo').classList.add('on');
  document.getElementById('mw').innerHTML='이미지를 만들고 있어요...';
  try{
    if(document.fonts) await document.fonts.ready;
    var cv=await html2canvas(document.getElementById('cap'),{backgroundColor:'#FFFFFF',scale:2});
    var img=new Image(); img.src=cv.toDataURL('image/png');
    document.getElementById('mw').innerHTML='';
    document.getElementById('mw').appendChild(img);
    var p=document.createElement('p'); p.style.cssText='font-size:12px;color:#888;margin-top:8px;';
    p.textContent='이미지를 길게 눌러서 저장해주세요.';
    document.getElementById('mw').appendChild(p);
  }catch(e){ document.getElementById('mw').textContent='이미지 생성에 실패했어요.'; }
}
</script>
</body>
</html>
