function mapHTML(type,color){var L=D.compatLabels||{};
var list=compatList(type);if(!list.length)return "";
var pm={};list.forEach(function(x){pm[x.type]=x.pct;});
var g="";
for(var i=0;i<D.cast.length;i++){var c=D.cast[i];
if(c.type===type){
var meFg=readable(color);
g+='<div class="mapc me" style="background:'+color+';color:'+meFg+'">'+
'<span class="e">'+c.emoji+'</span><span class="n">'+esc(c.name)+'</span>'+
'<span class="badge">나</span></div>';
}else{var p=pm[c.type]||0;var bg=tint(color,p);var fg=readable(bg);
g+='<div class="mapc" style="background:'+bg+';color:'+fg+'">'+
'<span class="e">'+c.emoji+'</span><span class="n">'+esc(c.name)+'</span>'+
'<span class="p" style="opacity:1">'+p+'%</span></div>';}}
var bar="linear-gradient(90deg,"+tint(color,72)+","+tint(color,99)+")";
return '<div class="map"><div class="maph">'+esc(L.mapTitle||"나의 궁합 지도")+'</div>'+
'<div class="mapg">'+g+'</div>'+
'<div class="mapf"><span>안 맞음</span><span class="mapbar" style="background:'+bar+'"></span>'+
'<span>잘 맞음</span></div></div>';}
function blockHTML(name,r){
if(name==="quote"&&r.quote){var qcls=D.quoteStyle==="bubble"?"qbb":"qb";
return '<div class="blk"><div class="blt">'+esc(lab("quote")||"한마디")+'</div>'+
'<div class="'+qcls+'">'+esc(r.quote)+'</div></div>';}
if(name==="traits"&&r.traits&&r.traits.length){var h='<div class="blk"><div class="blt">'+
esc(lab("traits")||"세부 특징")+'</div>';
if(D.traitStyle==="sticker"){h+='<div class="trss">';
for(var i=0;i<r.traits.length;i++){h+='<div class="tst">'+esc(r.traits[i])+'</div>';}
h+='</div>';
}else{h+='<div class="trs">';
for(var i2=0;i2<r.traits.length;i2++){h+='<div class="tc">'+esc(r.traits[i2])+'</div>';}
h+='</div>';}
return h+"</div>";}
if(name==="duo"&&r.duo){var g=r.duo.good||[],b=r.duo.bad||[];var chk=D.duoStyle==="check";
var gm=chk?"✓":"",bm=chk?"✗":"",dcls=chk?" chk":"";
var h2='<div class="blk duo"><div class="dsec g"><div class="dsh">'+esc(lab("duo","good")||"좋은 면")+'</div><div class="dls">';
for(var j=0;j<g.length;j++){h2+='<div class="dit'+dcls+'"><b>'+gm+'</b><span>'+esc(g[j])+'</span></div>';}
h2+='</div></div><div class="dsec b"><div class="dsh">'+esc(lab("duo","bad")||"아쉬운 면")+'</div><div class="dls">';
for(var k2=0;k2<b.length;k2++){h2+='<div class="dit'+dcls+'"><b>'+bm+'</b><span>'+esc(b[k2])+'</span></div>';}
return h2+"</div></div></div>";}
if(name==="stats"&&r.stats&&r.stats.length){
var h3='<div class="blk"><div class="blt">'+esc(lab("stats")||"지표")+'</div>';
if(D.statStyle==="radial"){
h3+='<div class="stsr">';
for(var m=0;m<r.stats.length;m++){var s=r.stats[m];var v=Math.max(0,Math.min(100,s.value||0));
var C=100.53;var off=C*(1-v/100);
h3+='<div class="rgauge"><svg viewBox="0 0 38 38">'+
'<circle class="rtrack" cx="19" cy="19" r="16"/>'+
'<circle class="rfill" cx="19" cy="19" r="16" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" transform="rotate(-90 19 19)"/>'+
'<text x="19" y="23" text-anchor="middle" style="font-size:10px;font-weight:900;fill:var(--ink)">'+v+'%</text>'+
'</svg><div class="rlab">'+esc(s.label)+'</div></div>';}
h3+='</div>';
}else{
h3+='<div class="sts">';
for(var m2=0;m2<r.stats.length;m2++){var s2=r.stats[m2];var v2=Math.max(0,Math.min(100,s2.value||0));
var fc=Math.max(1,Math.min(10,Math.round(v2/10)));var sq="";
for(var n2=1;n2<=10;n2++){sq+='<span class="sq'+(n2<=fc?" f":"")+'"></span>';}
h3+='<div class="srow"><div class="slab">'+esc(s2.label)+'</div><div class="sqs">'+sq+'</div>'+
'<div class="spc">'+v2+'%</div></div>';}
h3+='</div>';
}
return h3+"</div>";}
if(name==="cards"&&r.cards&&r.cards.length){
var h4='<div class="blk"><div class="blt">'+esc(lab("cards")||"이런 사람")+'</div>';
if(D.cardStyle==="ticket"){h4+='<div class="cdt">';
for(var p=0;p<r.cards.length;p++){h4+='<div class="cdti"><b>'+esc(r.cards[p].label)+'</b><span>'+
esc(r.cards[p].value)+'</span></div>';}
h4+='</div>';
}else{h4+='<div class="cds" style="margin-top:9px">';
for(var p2=0;p2<r.cards.length;p2++){h4+='<div class="cd2"><b>'+esc(r.cards[p2].label)+'</b><p>'+
esc(r.cards[p2].value)+'</p></div>';}
h4+='</div>';}
return h4+"</div>";}
return "";}
function result(code){var r=null;
for(var i=0;i<D.results.length;i++){if(D.results[i].type===code){r=D.results[i];break;}}
if(!r)r=D.results[0];
setAcc(r.color||D.accent);
var sum=(nick?esc(nick)+"님은 ":"")+esc(r.summary);
var h='<div class="cap" id="cap"><div class="rh"><h2>'+esc(D.meta.title)+'</h2></div><div class="rb">'+
'<div class="rn"><div class="em">'+esc(r.emoji||"✨")+'</div><h3>'+esc(r.name||D.meta.title)+'</h3>'+
(r.tagline?'<div class="tg2">'+esc(r.tagline)+'</div>':"")+'</div>'+
'<div class="rs">'+sum+'</div>';
var col=r.color||D.accent;
for(var b=0;b<D.blocks.length;b++){if(D.blocks[b]!=="map")h+=blockHTML(D.blocks[b],r);}
h+=compatHTML(r.type);
if(D.blocks.indexOf("map")>=0)h+=mapHTML(r.type,col);
h+='<div class="rf">POWERED BY MAGIC FACTORY</div></div></div>'+
'<div class="stk"><button class="btn fill" onclick="sheet(\''+code+'\')">'+
esc(D.meta.sheetCta||"내 유형의 정체 확인하기")+'</button>'+
'<button class="btn" onclick="saveImg(this)">결과 이미지 저장하기</button>'+
'<button class="btn" onclick="share()">테스트 공유하기</button>'+
'<button class="btn" onclick="intro()">다시 해보기</button></div>';
$("s5").innerHTML=h;}
function sheet(code){var me=byType(code)||D.cast[0];
var rows="";
for(var i=0;i<D.cast.length;i++){var c=D.cast[i];var isMe=c.type===code;
if(i===8){rows+='</div><div class="sheetad">광고 영역 (애드센스 코드 삽입 위치)</div><div class="rows">';}
rows+='<div class="row'+(isMe?" me":"")+'"><span class="no">'+("0"+(i+1)).slice(-2)+'</span>'+
'<span class="em">'+c.emoji+'</span>'+
'<span class="nm">'+esc(c.name)+(c.tagline?'<span class="tg">'+esc(c.tagline)+'</span>':"")+'</span>'+
'<span class="cd">'+esc(c.type)+'</span></div>';}
$("s6").innerHTML='<div class="sheet">'+
'<div class="sheeth"><h2>'+esc(D.meta.sheetTitle||"전체 유형 정답지")+'</h2>'+
'<p>열여섯 종류가 각각 어떤 성격 유형인지 전부 공개해요</p></div>'+
'<div class="reveal"><div class="em">'+me.emoji+'</div>'+
'<div class="nm">'+(nick?esc(nick)+"님의 ":"")+esc(me.name)+'</div>'+
'<div class="eq">의 성격 유형은</div>'+
'<div class="code">'+esc(me.type)+'</div></div>'+
'<div class="sheetad">광고 영역 (애드센스 코드 삽입 위치)</div>'+
'<div class="sheetsec">'+esc(D.meta.setName||"전체 16종")+' 전체 목록</div>'+
'<div class="rows">'+rows+'</div>'+
'<div class="sheetad">광고 영역 (애드센스 코드 삽입 위치)</div>'+
'</div>'+
'<div class="stk"><button class="btn fill" onclick="show(\'s5\')">내 결과로 돌아가기</button>'+
'<button class="btn" onclick="share()">테스트 공유하기</button>'+
'<button class="btn" onclick="intro()">다시 해보기</button></div>';
show("s6");}
function frames(){return new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r);});});}
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
var lastBlob=null,lastUrl="";
function fileName(){return (D.meta.slug||"result")+".png";}
function saveOptions(){
var canShare=false;
try{canShare=!!(navigator.canShare&&lastBlob&&navigator.canShare({files:[new File([lastBlob],fileName(),{type:"image/png"})]}));}catch(e){}
var h="";
if(canShare)h+='<button class="mbtn pri" onclick="shareImg()">사진으로 저장 · 공유</button>';
else h+='<p class="mtip" style="margin:0 0 10px;">위 이미지를 <b>길게 눌러서 사진에 저장</b>해 주세요.</p>';
h+='<a class="mbtn" href="'+lastUrl+'" download="'+fileName()+'" target="_blank" rel="noopener">새 탭에서 이미지 열기</a>';
return '<div class="mbtns">'+h+'</div>'+
'<p class="mtip">"이미지 열기"를 눌렀을 때 저장이 안 되면, 위 이미지를 직접 길게 눌러 저장해 주세요.</p>';}
async function shareImg(){
try{var f=new File([lastBlob],fileName(),{type:"image/png"});
await navigator.share({files:[f],title:D.meta.title});}
catch(e){if(e&&e.name!=="AbortError")toast("공유를 취소했거나 지원되지 않아요.");}}
async function saveImg(btn){
if(typeof html2canvas!=="function"){toast("이미지 도구를 불러오지 못했어요. 새로고침 후 다시 시도해 주세요.");return;}
btn.disabled=true;var old=btn.textContent;btn.textContent="이미지 만드는 중...";
$("mw").innerHTML='<p style="padding:40px 0;">이미지를 만들고 있어요...</p>';
$("mo").classList.add("on");document.body.style.overflow="hidden";
try{
if(document.fonts){try{await document.fonts.ready;}catch(e){}}
await frames();await wait(260);
var cv=await html2canvas($("cap"),{backgroundColor:getComputedStyle(document.body).backgroundColor,
scale:Math.min(window.devicePixelRatio||2,2),useCORS:true,logging:false,
scrollX:0,scrollY:-window.scrollY,windowWidth:document.documentElement.clientWidth});
if(lastUrl&&lastUrl.indexOf("blob:")===0){try{URL.revokeObjectURL(lastUrl);}catch(e){}}
var dataUrl=cv.toDataURL("image/png");
lastBlob=await new Promise(function(res){
if(cv.toBlob)cv.toBlob(function(b){res(b);},"image/png");else res(null);});
if(!lastBlob){
  var bin=atob(dataUrl.split(",")[1]),arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  lastBlob=new Blob([arr],{type:"image/png"});}
lastUrl=dataUrl;
$("mw").innerHTML='<img src="'+lastUrl+'" alt="결과 이미지">'+saveOptions();
}catch(e){console.error(e);
$("mw").innerHTML='<p style="padding:32px 0 8px;">이미지를 만들지 못했어요.<br>'+
'대신 화면을 캡처해서 공유해 주세요.</p>'+
'<p class="mtip">오류: '+esc(String(e&&e.message||e))+'</p>';
}finally{btn.disabled=false;btn.textContent=old;}}
function closeMo(){$("mo").classList.remove("on");document.body.style.overflow="";}
$("mo").addEventListener("click",function(e){if(e.target===$("mo"))closeMo();});
document.addEventListener("keydown",function(e){
if(e.key==="Escape"&&$("mo").classList.contains("on"))closeMo();});
async function share(){var dt={title:D.meta.title,text:D.meta.intro,url:location.href};
try{if(navigator.share){await navigator.share(dt);return;}
var tx=dt.text+"\n"+dt.url;
if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(tx);
toast("링크를 복사했어요.");return;}
var ta=document.createElement("textarea");ta.value=tx;ta.style.position="fixed";ta.style.opacity="0";
document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();
toast("링크를 복사했어요.");}catch(e){if(e&&e.name!=="AbortError")toast("공유하지 못했어요.");}}
function toast(m){clearTimeout(tT);var e=$("tst");e.textContent=m;e.classList.add("show");
tT=setTimeout(function(){e.classList.remove("show");},2100);}
intro();
</script>
</body>
</html>
